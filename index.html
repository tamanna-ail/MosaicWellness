<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped column; the living garden is the hero of every screen; fixed bottom tab bar. */
:root{
  --bg:#edf2ea; --surface:#ffffff; --surface-2:#f5f8f2; --ink:#1c2a21; --muted:#5b6b60; --line:#d6e0d4;
  --accent:#d4700f; --accent-ink:#ffffff; --accent-soft:#fbe7d0;
  --leaf:#2f7d4c; --leaf-soft:#dcefdf;
  --eat:#c84d38; --move:#2e76b8; --rest:#6553bd; --mind:#2f8a62;
  --eat-soft:#f8e1dc; --move-soft:#dde9f5; --rest-soft:#e7e3f6; --mind-soft:#dcefe5;
  --frost:#3d8fc2;
  --shadow:0 1px 2px rgba(28,42,33,.06),0 8px 24px rgba(28,42,33,.08);
  --f-display:"DynaPuff","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --eat-soft:#3a2420; --move-soft:#1c2c3c; --rest-soft:#27233e; --mind-soft:#1b3328;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --eat-soft:#3a2420; --move-soft:#1c2c3c; --rest-soft:#27233e; --mind-soft:#1b3328;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 104px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font-size:1.25rem}
h3{font-size:1rem}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;color:var(--leaf);display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--accent)}
.pill.frost{color:var(--frost)}
.pill.cold{color:var(--muted)}

/* Garden scene: a committed illustration whose palette follows the real time of day, not the app theme */
.scene{position:relative;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow);
  --sky1:#8ccbef;--sky2:#d9f1f7;--orb:#ffe066;--hill1:#a8d58b;--hill2:#93c776;--g1:#8fc76c;--g2:#6aa94f;--soil:#7a5236;--soil2:#5f3e27;--tuft:#5c9a45}
.scene.tod-dawn{--sky1:#f3c3a6;--sky2:#bfdfe9;--orb:#ffcf7a;--hill1:#a4cf8a;--hill2:#8dc177;--g1:#8cc26b;--g2:#69a651}
.scene.tod-dusk{--sky1:#5d4f9e;--sky2:#f3a06e;--orb:#ff9d5c;--hill1:#6d8f62;--hill2:#5d8156;--g1:#76a35a;--g2:#5b8a47;--soil:#6c4831}
.scene.tod-night{--sky1:#0d1a36;--sky2:#2c3d6b;--orb:#f2efd6;--hill1:#2e4d3d;--hill2:#26432f;--g1:#3d6a47;--g2:#2b5238;--soil:#4f3624;--soil2:#3e2a1c;--tuft:#2f5a3b}
.sky{position:relative;height:84px;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.scene.big .sky{height:110px}
.orb{position:absolute;top:18px;right:34px;width:34px;height:34px;border-radius:50%;background:var(--orb);box-shadow:0 0 30px 6px color-mix(in srgb,var(--orb) 55%,transparent)}
.tod-night .orb{box-shadow:0 0 22px 4px rgba(242,239,214,.35)}
.tod-night .orb::after{content:"";position:absolute;inset:-2px -9px 4px 9px;border-radius:50%;background:var(--sky1);opacity:.0}
.stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 12% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 62%,#fff,transparent),radial-gradient(1.6px 1.6px at 46% 22%,#fff,transparent),radial-gradient(1.1px 1.1px at 63% 48%,#fff,transparent),radial-gradient(1.3px 1.3px at 78% 70%,#fff,transparent),radial-gradient(1.2px 1.2px at 8% 75%,#fff,transparent),radial-gradient(1.4px 1.4px at 55% 80%,#fff,transparent)}
.tod-night .stars{opacity:.85}
.hill{position:absolute;bottom:-40px;border-radius:50%}
.hill.h1{left:-20%;width:80%;height:90px;background:var(--hill1)}
.hill.h2{right:-25%;width:85%;height:76px;background:var(--hill2)}
.bed{position:relative;background:linear-gradient(180deg,var(--g1),var(--g2));padding:6px 10px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:4px;row-gap:0}
.plot{position:relative;aspect-ratio:1/.86;border:0;background:none;padding:0;display:block;-webkit-tap-highlight-color:transparent}
.plot .soil{position:absolute;left:9%;right:9%;bottom:8%;height:36%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--soil),var(--soil2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.plot.empty .soil{opacity:.75}
.plot .add{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);color:#3b5b2e;font-weight:700;font-size:16px;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.plot.locked{cursor:default}
.plot.locked .tufts{position:absolute;inset:auto 6% 10% 6%;height:46%;background:
  radial-gradient(ellipse 18% 70% at 18% 100%,var(--tuft) 60%,transparent 62%),
  radial-gradient(ellipse 16% 90% at 40% 100%,var(--tuft) 60%,transparent 62%),
  radial-gradient(ellipse 18% 75% at 63% 100%,var(--tuft) 60%,transparent 62%),
  radial-gradient(ellipse 15% 85% at 84% 100%,var(--tuft) 60%,transparent 62%)}
.plot.locked .lock{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:.62rem;font-weight:700;color:rgba(255,255,255,.92);background:rgba(20,40,20,.35);padding:1px 6px;border-radius:6px;white-space:nowrap}
.plot svg.plant{position:absolute;left:50%;bottom:15%;width:118%;transform:translateX(-50%);overflow:visible;pointer-events:none}
.plot svg.plant.tall{width:175%}
.plot svg.plant.wide{width:140%}
.scene.interactive .plot:not(.locked):hover .soil{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.7)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.glow{opacity:.18;transition:opacity .4s}
.tod-night .glow,.tod-dusk .glow{opacity:.95}
.wilted .plot svg.plant{filter:saturate(.25) brightness(.92) sepia(.25)}
.wilted .sway{animation:none;transform:rotate(7deg) skewX(4deg)}
.visitor{position:absolute;pointer-events:none;z-index:5}
.bfly{width:20px;animation:flutter 9s ease-in-out infinite}
.bfly svg{animation:flap .35s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-18px)}50%{transform:translate(120px,10px)}75%{transform:translate(50px,26px)}100%{transform:translate(0,0)}}
.fly{width:5px;height:5px;border-radius:50%;background:#fff6a8;box-shadow:0 0 8px 3px rgba(255,240,140,.8);animation:blink 2.6s ease-in-out infinite,drift 7s ease-in-out infinite;opacity:.35}
.tod-night .fly,.tod-dusk .fly{opacity:1}
@keyframes blink{0%,100%{filter:brightness(.4)}50%{filter:brightness(1.3)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-12px)}}
.peacock{width:64px;right:10px;top:46px}
.scene.big .peacock{top:66px;width:76px}
.scene-note{position:absolute;left:12px;top:12px;z-index:6;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.88);color:#3c3020;max-width:calc(100% - 100px)}
.scene-note.warn{background:#fff1d6;color:#7a4300}
.scene-link{display:block;width:100%;border:0;padding:0;background:none;text-align:left;border-radius:24px}

/* Today */
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dot{flex:1;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s}
.dot.on{background:var(--leaf);border-color:var(--leaf)}
.dot.extra{background:var(--accent);border-color:var(--accent)}
.next{font-size:.88rem;color:var(--muted)}
.next b{color:var(--ink)}
.domain{display:flex;flex-direction:column;gap:8px}
.domain-h{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.domain-h i{width:9px;height:9px;border-radius:3px;display:inline-block}
.quest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;transition:transform .12s,background .2s,border-color .2s}
.quest:active{transform:scale(.985)}
.quest .chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:all .2s}
.quest .chk svg{width:16px;height:16px;opacity:0}
.quest.done{background:var(--surface-2)}
.quest.done .chk{background:var(--leaf);border-color:var(--leaf)}
.quest.done .chk svg{opacity:1}
.quest .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.quest .qt b{font-weight:600}
.quest.done .qt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.quest .qt small{color:var(--muted);font-size:.8rem}
.quest .rw{flex:none;width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.quest .rw svg{width:38px;height:38px}
.c-eat{background:var(--eat)} .c-move{background:var(--move)} .c-rest{background:var(--rest)} .c-mind{background:var(--mind)}

/* Garden tab */
.shed{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.item svg{width:52px;height:56px}
.item b{font-size:.8rem;font-weight:600;line-height:1.2}
.item small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item.none{opacity:.45}
.section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;font-size:.76rem;color:var(--muted)}
.stages svg{width:100%;max-width:56px;height:60px}

/* Neighbours */
.board{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rk{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.me{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.row.me .rk{color:var(--accent)}
.row .xp{font-weight:700;font-variant-numeric:tabular-nums}
.zone{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);padding:6px 4px 2px}
.buddy{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.buddy:last-child{border-bottom:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff}
.buddy .bt{flex:1;min-width:0}
.buddy .bt small{display:block;color:var(--muted);font-size:.82rem}
.bstreak{font-family:var(--f-display);font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bstreak svg{width:18px;height:18px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 11px;font-size:.84rem}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.danger{background:var(--eat);color:#fff;box-shadow:none}
.fineprint{font-size:.78rem;color:var(--muted)}

/* You */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.lvl{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.lvl i{display:block;height:100%;background:var(--accent);border-radius:999px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.cal .c.part{background:var(--leaf-soft);border-color:var(--leaf-soft)}
.cal .c.full{background:var(--leaf);border-color:var(--leaf)}
.cal .c.frz{background:var(--frost);border-color:var(--frost)}
.cal .c.today{outline:2px solid var(--accent);outline-offset:1px}
.cal .c.future{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.74rem;color:var(--muted)}
.badge .bd{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px dashed var(--line)}
.badge .bd svg{width:44px;height:48px}
.badge.got .bd{background:var(--accent-soft);border:2px solid var(--accent)}
.badge.got{color:var(--ink)}
.badge:not(.got) svg{filter:grayscale(1);opacity:.4}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.howto{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:62ch}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--leaf);background:var(--leaf-soft)}

/* Sheet, toast, celebration */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;animation:rise .25s cubic-bezier(.2,.8,.3,1)}
.sheet.center{border-radius:24px;margin:16px;align-self:center}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.picks button{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.picks button svg{width:52px;height:56px}
.picks button b{font-size:.8rem;font-weight:600}
.picks button small{font-size:.74rem;color:var(--muted)}
.picks button:hover{border-color:var(--leaf)}
.sheet-row{display:flex;gap:8px;flex-wrap:wrap}
.sheet-row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px 9px 10px;border-radius:14px;font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:pop .25s}
.toast svg{width:30px;height:32px;flex:none;background:var(--surface);border-radius:8px}
.celebrate{text-align:center;align-items:center}
.celebrate .big{font-family:var(--f-display);font-weight:700;font-size:4.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.celebrate .reward{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:8px 14px 8px 8px;text-align:left}
.celebrate .reward svg{width:48px;height:52px;flex:none}
.petals{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.petals span{position:absolute;top:-20px;width:12px;height:8px;border-radius:60% 40% 60% 40%;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .sway,.bfly,.bfly svg,.fly{animation:none}
  .sheet,.toast,.backdrop{animation:none}
}
@media (max-width:380px){.bed{padding-inline:6px;column-gap:2px}.plot.locked .lock{font-size:.55rem}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in" role="tablist" id="tabs"></div></nav>

<script>
(function(){
"use strict";
/* ---------- Data ---------- */
const DOMAINS = {
  eat:  {name:"Eat well", cls:"c-eat"},
  move: {name:"Move", cls:"c-move"},
  rest: {name:"Rest", cls:"c-rest"},
  mind: {name:"Mind", cls:"c-mind"}
};
const QUESTS = [
  {id:"veg",     d:"eat",  t:"Vegetables with two meals",        item:"marigold"},
  {id:"water",   d:"eat",  t:"Eight glasses of water",            item:"lotus"},
  {id:"cook",    d:"eat",  t:"One home-cooked meal",              item:"tulsi"},
  {id:"nosugar", d:"eat",  t:"No sugary drinks today",            visitor:"butterflies"},
  {id:"steps",   d:"move", t:"Walk 7,000 steps",                  item:"stone"},

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function realToday(){ const d=new Date(); d.setHours(12,0,0,0); return d; }

function addDays(k,n){ const [y,m,dd]=k.split("-").map(Number); const d=new Date(y,m-1,dd,12); d.setDate(d.getDate()+n); return key(d); }
const T = () => key(today());

/* ---------- State ---------- */
function fresh(){ return {v:1, offset:0, log:{}, frozen:[], inv:{}, plots:Array(TOTAL_PLOTS).fill(null), xp:0, best:0, freezes:0, got:[], checked:null, sample:false, welcomed:true}; }
function sample(){
  const s=fresh(); s.sample=true; s.welcomed=false;
  const t=key(realToday());
  const sets=[["veg","water","steps","sleep"],["veg","workout","outside"],["water","cook","stretch","breathe"],["steps","sleep","nosugar"],["veg","water","workout","screens","outside"],["cook","steps","breathe"]];
  for(let i=12;i>=1;i--) s.log[addDays(t,-i)] = sets[i%sets.length].slice();
  s.log[t]=["water"];
  const P=(i,item,ago)=>{ s.plots[i]={item, on:addDays(t,-ago)}; };
  P(0,"mango",11); P(2,"sunflower",9); P(4,"gulmohar",6);
  P(5,"marigold",10); P(6,"tulsi",8); P(7,"stone",5); P(8,"lotus",7);
  P(10,"jasmine",4); P(11,"marigold",3); P(12,"swing",9); P(13,"lantern",2);
  s.inv={sunflower:1, stone:1, birdbath:1, lotus:1};
  s.got=[3,7]; s.freezes=1; s.best=12; s.checked=t;
  let xp=0; for(const k in s.log){ const n=s.log[k].length; xp+=n*10+(n>=NEED?20:0); } s.xp=xp;
  return s;
}
let S;
function load(){ try{ const raw=localStorage.getItem(STORE); if(raw){ const p=JSON.parse(raw); if(p&&p.v===1) return p; } }catch(e){} return null; }

S = load() || sample();

/* ---------- Rules ---------- */
const done = k => (S.log[k]||[]);
const complete = k => done(k).length >= NEED;
const frozen = k => S.frozen.includes(k);
const ok = k => complete(k) || frozen(k);
function streak(){
  let k = complete(T()) ? T() : addDays(T(),-1), n=0;
  for(let i=0;i<500;i++){ if(complete(k)) n++; else if(!frozen(k)) break; k=addDays(k,-1); }
  return n;
}
const hasHistory = () => Object.keys(S.log).some(complete);
const wilting = () => hasHistory() && !complete(T()) && !ok(addDays(T(),-1));
function applyFreezes(){
  if(S.checked===T()) return null;
  S.checked=T();
  const gap=[]; let k=addDays(T(),-1);
  while(!ok(k) && gap.length<60){ gap.push(k); k=addDays(k,-1); }
  if(!gap.length || gap.length>=60 || !hasHistory()) return null;
  if(S.freezes >= gap.length){ gap.forEach(g=>S.frozen.push(g)); S.freezes-=gap.length; return gap.length; }
  return null;
}
function goodDaysSince(from){
  let c=0, k=from, t=T();
  for(let i=0;i<120 && k<=t;i++){ if(ok(k)) c++; k=addDays(k,1); }
  return c;
}
function stageOf(p){
  const it=ITEMS[p.item]; if(it.fixed) return 3;
  const c=goodDaysSince(p.on), g=it.grow;
  return c>=g[2]?3 : c>=g[1]?2 : c>=g[0]?1 : 0;
}
const unlocked = () => Math.min(TOTAL_PLOTS, BASE_PLOTS + 2*Math.floor(S.best/3));

    for(let i=0;i<9;i++) vis+=`<span class="visitor fly" style="left:${8+i*10.5}%;top:${38+((i*37)%45)}%;animation-delay:-${(i*0.7).toFixed(1)}s,-${(i*1.3).toFixed(1)}s"></span>`;

  if(S.got.includes(14)) vis+=`<span class="visitor peacock">${peacockSVG()}</span>`;
  let note="";
  if(wilt) note=`<span class="scene-note warn">Your garden is wilting. Finish ${NEED} quests to revive it.</span>`;
  else if(!complete(T())) note=`<span class="scene-note">${NEED-Math.min(NEED,todayDone.length)} more quest${NEED-todayDone.length===1?"":"s"} to grow today</span>`;
  else note=`<span class="scene-note">Watered for today</span>`;
  return `<div class="scene tod-${t} ${wilt?"wilted":""} ${interactive?"interactive big":""}">
    <div class="sky"><div class="stars"></div><div class="orb"></div><div class="hill h1"></div><div class="hill h2"></div></div>
    <div class="bed">${tiles}</div>${vis}${note}</div>`;
}

/* Neighbours (simulated for the demo) */
function rnd(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return ((h>>>0)%10000)/10000; }
function weekStart(){ const d=today(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return key(d); }
const daysIntoWeek = () => (today().getDay()+6)%7+1;
function myWeekXP(){ let k=weekStart(), x=0; for(let i=0;i<daysIntoWeek();i++){ const n=done(k).length; x+=n*10+(n>=NEED?20:0); k=addDays(k,1);} return x; }
const NB=[["Meera","#c2557a"],["Kabir","#2e76b8"],["Ishita","#8a5fb5"],["Rohan","#c9701d"],["Zoya","#2f8a62"],["Aarav","#b2493a"],["Dev","#4a6fa5"],["Tara","#7b8a2e"]];
const friendDone = (n,k) => rnd(n+"|"+k) < 0.86;
function buddyStreak(n){ let k=(complete(T())&&friendDone(n,T()))?T():addDays(T(),-1), c=0; for(let i=0;i<400;i++){ if(complete(k)&&friendDone(n,k)) c++; else break; k=addDays(k,-1);} return c; }
function neighboursView(){
  const wk=weekStart(), dw=daysIntoWeek();
  const rows=NB.map(([n,c])=>({n,c,xp:Math.round(dw*(35+rnd(n+wk)*75)/5)*5})).concat([{n:"You",me:true,xp:myWeekXP()}]).sort((a,b)=>b.xp-a.xp);
  const board=rows.map((r,i)=>(i===3?`<div class="zone" style="color:var(--muted)">Safe zone</div>`:"")+`<div class="row ${r.me?"me":""}"><span class="rk">${i+1}</span><span>${r.me?"<b>You</b>":r.n}</span><span class="xp">${r.xp} XP</span></div>`).join("");
  const buddies=[NB[0],NB[1]].map(([n,c])=>{
    const bs=buddyStreak(n), fd=friendDone(n,T()), me=complete(T());
    const status = fd ? `${n} has finished today.` : `${n} hasn't finished today yet.`;
    const mine = me ? "" : " Finish yours to keep the streak.";
    return `<div class="buddy"><span class="av" style="background:${c}">${n[0]}</span><div class="bt"><b>${n}</b><small>${status}${mine}</small></div><span class="bstreak">${sproutIcon()}<span>${bs}</span></span><button class="btn small ghost" data-nudge="${n}" data-done="${fd?1:0}">${fd?"Send seed":"Nudge"}</button></div>`;
  }).join("");
  return topBar()+
    `<section class="section panel"><div class="sec-h"><h2>Buddy gardens</h2><span class="muted">Shared streaks</span></div>
      <p class="fineprint" style="margin:0">A buddy streak grows only on days when both of you finish ${NEED} quests.</p>
      <div>${buddies}</div></section>
    <section class="section panel"><div class="sec-h"><h2>Marigold League</h2><span class="muted num">Day ${dw} of 7</span></div>
      <div class="zone">Top three move up to Lotus League</div>
      <div class="board">${board}</div></section>
    <p class="fineprint">Neighbours on this screen are simulated so the demo works for a single visitor. XP: 10 per quest, 20 bonus for a complete day.</p>`;
}

let toastTimer;

  document.querySelectorAll(".toast").forEach(t=>t.remove());

function petals(){

  const box=document.createElement("div"); box.className="petals";
  const cols=["#f39a26","#e3711a","#f28fb1","#f5c518","#ffffff","#e14b2a"];
  for(let i=0;i<46;i++){ const s=document.createElement("span"); s.style.left=(Math.random()*100)+"%"; s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); s.style.setProperty("--r",(Math.random()*720-360)+"deg");
    s.style.animationDuration=(2.4+Math.random()*2)+"s"; s.style.animationDelay=(Math.random()*.6)+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5200);
}
function sheet(html, center){
  closeSheet();
  const b=document.createElement("div"); b.className="backdrop"; b.id="sheet";
  b.innerHTML=`<div class="sheet ${center?"center":""}" role="dialog" aria-modal="true">${center?"":`<span class="grab"></span>`}${html}</div>`;
  b.addEventListener("click",e=>{ if(e.target===b && !b.dataset.locked) closeSheet(); });
  document.body.appendChild(b);
  const f=b.querySelector("button"); if(f) f.focus({preventScroll:true});
  return b;
}
function closeSheet(){ const s=document.getElementById("sheet"); if(s) s.remove(); }

/* ---------- Actions ---------- */
function toggleQuest(id){
  const k=T(); const list=S.log[k]||(S.log[k]=[]); const q=QUESTS.find(x=>x.id===id);
  const wasComplete=list.length>=NEED;
  if(list.includes(id)){
    list.splice(list.indexOf(id),1); S.xp=Math.max(0,S.xp-10);
    if(q.item && S.inv[q.item]>0) S.inv[q.item]--;
    if(wasComplete && list.length<NEED) S.xp=Math.max(0,S.xp-20);
    toast("Quest unmarked");
  } else {
    list.push(id); S.xp+=10;
    if(q.item){ S.inv[q.item]=(S.inv[q.item]||0)+1; toast(`+10 XP · ${ITEMS[q.item].name} added to your shed`, q.item); }
    else toast(q.visitor==="butterflies"?"+10 XP · Butterflies are visiting your garden":"+10 XP · Fireflies will light your garden tonight");
    if(!wasComplete && list.length>=NEED){ save(); render(); dayComplete(); return; }
  }
  save(); render();
}
function dayComplete(){
  S.xp+=20; const s=streak(); S.best=Math.max(S.best,s);
  let rewardHTML="";
  if(s>0 && s%7===0 && S.freezes<2){ S.freezes++; rewardHTML+=`<div class="reward"><span style="width:48px;height:48px;display:grid;place-items:center;color:var(--frost)">${netIcon()}</span><span><b>Shade net</b><br><small class="muted">Protects your streak on one missed day.</small></span></div>`; }
  const m=MILESTONES.find(x=>x.day===s && !S.got.includes(x.day));
  if(m){
    S.got.push(m.day);
    if(m.reward==="peacock") rewardHTML+=`<div class="reward">${peacockSVG()}<span><b>A peacock moved in</b><br><small class="muted">It now lives in your garden.</small></span></div>`;
    else { S.inv[m.reward]=(S.inv[m.reward]||0)+1; rewardHTML+=`<div class="reward">${itemSVG(m.reward,3)}<span><b>${ITEMS[m.reward].name}</b><br><small class="muted">A milestone reward, now in your shed.</small></span></div>`; }
  }
  const grew=S.plots.filter(p=>p && !ITEMS[p.item].fixed && stageOf(p)<3).length;
  save(); render(); petals();
  sheet(`<div class="celebrate" style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <span class="muted" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem">Day complete</span>
    <span class="big">${s}</span>
    <h2>${s===1?"Your streak has begun":`${s} good days in a row`}</h2>
    <p class="muted" style="margin:0;max-width:34ch">+20 XP bonus. ${grew?`${grew} plant${grew===1?" is":"s are"} still growing toward full bloom.`:"Every plant in your garden is in full bloom."}</p>
    ${rewardHTML}
    <div class="sheet-row" style="width:100%"><button class="btn leaf" data-act="see-garden">See my garden</button><button class="btn ghost" data-act="close">Keep going</button></div>
  </div>`, true);
}
function plotSheet(i){

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; confirmReset=false; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.go){ tab=t.dataset.go; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.quest){ toggleQuest(t.dataset.quest); return; }
  if(t.dataset.plot!==undefined){ plotSheet(+t.dataset.plot); return; }
  if(t.dataset.plant){ const i=+t.dataset.at, k=t.dataset.plant; if(S.inv[k]>0 && !S.plots[i]){ S.inv[k]--; S.plots[i]={item:k,on:T()}; save(); closeSheet(); render(); toast(`${ITEMS[k].name} planted`, k);} return; }
  if(t.dataset.unplant!==undefined){ const i=+t.dataset.unplant, p=S.plots[i]; if(p){ S.inv[p.item]=(S.inv[p.item]||0)+1; S.plots[i]=null; save(); closeSheet(); render(); toast(`${ITEMS[p.item].name} returned to the shed`);} return; }
  if(t.dataset.nudge){ toast(t.dataset.done==="1"?`Sunflower seed sent to ${t.dataset.nudge}`:`Nudge sent to ${t.dataset.nudge}`, t.dataset.done==="1"?"sunflower":null); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==="close"){ closeSheet(); }
  else if(a==="see-garden"){ closeSheet(); tab="garden"; render(); window.scrollTo({top:0}); }
  else if(a==="go-today"){ closeSheet(); tab="today"; render(); window.scrollTo({top:0}); }
  else if(a==="start"){ S=fresh(); S.inv={marigold:1, sunflower:1}; save(); closeSheet(); tab="today"; render(); toast("Two starter seeds are waiting in your shed","marigold"); }
  else if(a==="explore"){ S.welcomed=true; save(); closeSheet(); render(); }
  else if(a==="tomorrow"){ S.offset=(S.offset||0)+1; const used=applyFreezes(); save(); render();
    if(used) toast(`A shade net protected your streak for ${used} missed day${used===1?"":"s"}`);
    else if(wilting()) toast("A day was missed and the garden is wilting. Finish today's quests to revive it.");
    else toast("A new day. Fresh quests are ready."); }
  else if(a==="sample"){ S=sample(); S.welcomed=true; save(); tab="today"; render(); toast("Sample garden loaded"); }
  else if(a==="reset"){ confirmReset=true; render(); }
  else if(a==="reset-no"){ confirmReset=false; render(); }
  else if(a==="reset-yes"){ confirmReset=false; S=fresh(); S.inv={marigold:1, sunflower:1}; save(); tab="today"; render(); toast("A fresh garden with two starter seeds"); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const s=document.getElementById("sheet"); if(s && !s.dataset.locked) closeSheet(); }});

const used=applyFreezes(); save();
render();
if(used) toast(`A shade net protected your streak for ${used} missed day${used===1?"":"s"}`);
if(!S.welcomed) welcome();
setInterval(()=>{ const sc=document.querySelector(".scene"); if(sc){ const c="tod-"+tod(); if(!sc.classList.contains(c)) render(); } }, 60000);
})();
</script>
