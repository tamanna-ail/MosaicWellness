<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped column; the garden base (buildings on the hills, beds below) is the hero; fixed five-tab bar. */
:root{
  --bg:#edf2ea; --surface:#ffffff; --surface-2:#f5f8f2; --ink:#1c2a21; --muted:#5b6b60; --line:#d6e0d4;
  --accent:#d4700f; --accent-ink:#ffffff; --accent-soft:#fbe7d0;
  --leaf:#2f7d4c; --leaf-soft:#dcefdf;
  --eat:#c84d38; --move:#2e76b8; --rest:#6553bd; --mind:#2f8a62;
  --dry:#a7793f; --dry-soft:#f3e6d2;
  --frost:#3d8fc2;
  --shadow:0 1px 2px rgba(28,42,33,.06),0 8px 24px rgba(28,42,33,.08);
  --f-display:"DynaPuff","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --dry:#d7a867; --dry-soft:#3a2d1c;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --dry:#d7a867; --dry-soft:#3a2d1c;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 104px;display:flex;flex-direction:column;gap:18px}
.app.bare{padding-bottom:32px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;color:var(--leaf);display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--accent)}
.pill.cold{color:var(--muted)}
.pill.xp{color:var(--leaf)}
.pill.dry{color:var(--dry);background:var(--dry-soft);border-color:transparent}
.help{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;color:var(--leaf);font-size:1rem;line-height:1}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h1{font-size:1.45rem}
.hello p{color:var(--muted);font-size:.92rem}

/* One contextual nudge at a time */
.nudge{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:10px 14px 10px 10px;background:var(--leaf-soft);color:var(--ink)}
.nudge svg.fl{width:40px;height:48px;flex:none}
.nudge .bt{flex:1;min-width:0;display:flex;flex-direction:column}
.nudge .bt b{font-family:var(--f-display);font-weight:600}
.nudge .bt small{color:var(--muted);font-size:.82rem}
.nudge .go{flex:none;font-size:1.4rem;color:var(--leaf);font-weight:700}
.nudge.dry{background:var(--dry-soft)}
.nudge.dry .go{color:var(--dry)}
.nudge .meter{display:block;height:6px;border-radius:999px;background:color-mix(in srgb,var(--dry) 25%,transparent);margin-top:6px;overflow:hidden}
.nudge .meter i{display:block;height:100%;background:var(--dry);border-radius:999px}
.sprouts{display:flex;gap:4px;align-items:flex-end}
.sprouts svg{width:20px;height:20px;color:var(--line);transition:color .3s,transform .3s}
.sprouts svg.on{color:var(--leaf);transform:scale(1.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip.go{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip.dry{background:var(--dry-soft);border-color:transparent;color:var(--dry)}
/* Settings-style menu */
.menu{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 14px}
.mrow:last-child{border-bottom:0}
.mrow .mi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--leaf-soft);color:var(--leaf)}
.mrow .mi svg{width:20px;height:20px}
.mrow .bt{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .bt b{font-weight:600}
.mrow .bt small{color:var(--muted);font-size:.8rem}
.mrow .chev{color:var(--muted);font-size:1.3rem;font-weight:700}
.mrow:hover{background:var(--surface-2)}
.sheet h2+p{margin-top:-6px}

/* Garden scene: a committed illustration whose palette follows the real time of day, not the app theme */
.scene{position:relative;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow);
  --sky1:#8ccbef;--sky2:#d9f1f7;--orb:#ffe066;--hill1:#a8d58b;--hill2:#93c776;--g1:#8fc76c;--g2:#6aa94f;--soil:#7a5236;--soil2:#5f3e27}
.scene.tod-dawn{--sky1:#f3c3a6;--sky2:#bfdfe9;--orb:#ffcf7a;--hill1:#a4cf8a;--hill2:#8dc177;--g1:#8cc26b;--g2:#69a651}
.scene.tod-dusk{--sky1:#5d4f9e;--sky2:#f3a06e;--orb:#ff9d5c;--hill1:#6d8f62;--hill2:#5d8156;--g1:#76a35a;--g2:#5b8a47;--soil:#6c4831}
.scene.tod-night{--sky1:#0d1a36;--sky2:#2c3d6b;--orb:#f2efd6;--hill1:#2e4d3d;--hill2:#26432f;--g1:#3d6a47;--g2:#2b5238;--soil:#4f3624;--soil2:#3e2a1c}
.scene.dry{--g1:#b9b06a;--g2:#9b9150;--hill1:#c2b77a;--hill2:#b0a465}
.scene.dry.tod-night{--g1:#5b5a3a;--g2:#4a4930;--hill1:#4f4d34;--hill2:#45432d}
.sky{position:relative;height:84px;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.scene.big .sky{height:110px}
.orb{position:absolute;top:18px;right:34px;width:34px;height:34px;border-radius:50%;background:var(--orb);box-shadow:0 0 30px 6px color-mix(in srgb,var(--orb) 55%,transparent)}
.tod-night .orb{box-shadow:0 0 22px 4px rgba(242,239,214,.35)}
.stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 12% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 62%,#fff,transparent),radial-gradient(1.6px 1.6px at 46% 22%,#fff,transparent),radial-gradient(1.1px 1.1px at 63% 48%,#fff,transparent),radial-gradient(1.3px 1.3px at 78% 70%,#fff,transparent),radial-gradient(1.2px 1.2px at 8% 75%,#fff,transparent),radial-gradient(1.4px 1.4px at 55% 80%,#fff,transparent)}
.tod-night .stars{opacity:.85}
.hill{position:absolute;bottom:-40px;border-radius:50%}
.hill.h1{left:-20%;width:80%;height:90px;background:var(--hill1)}
.hill.h2{right:-25%;width:85%;height:76px;background:var(--hill2)}
.bed{position:relative;background:linear-gradient(180deg,var(--g1),var(--g2));padding:6px 10px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:4px;row-gap:0}
.plot{position:relative;aspect-ratio:1/.86;border:0;background:none;padding:0;display:block;-webkit-tap-highlight-color:transparent}
.plot .soil{position:absolute;left:9%;right:9%;bottom:8%;height:36%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--soil),var(--soil2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.plot.empty .soil{opacity:.75}
.plot .add{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#3b5b2e;font-weight:700;font-size:16px;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.plot svg.plant{position:absolute;left:50%;bottom:15%;width:118%;transform:translateX(-50%);transform-origin:50% 100%;overflow:visible;pointer-events:none;transition:transform .5s,filter .5s}
.plot svg.plant.tall{width:150%}
.scene.interactive .plot:hover .soil{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.7)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.scene.dry .sway{animation:none;transform:rotate(8deg) skewX(5deg)}
.visitor{position:absolute;pointer-events:none;z-index:5}
.bfly{width:20px;animation:flutter 9s ease-in-out infinite}
.bfly svg{animation:flap .35s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-18px)}50%{transform:translate(120px,10px)}75%{transform:translate(50px,26px)}100%{transform:translate(0,0)}}
.scene-note{position:absolute;left:12px;top:12px;z-index:6;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#3c3020;max-width:calc(100% - 100px)}
.scene-note.warn{background:#fff1d6;color:#7a4300}
.scene-link{display:block;width:100%;border:0;padding:0;background:none;text-align:left;border-radius:24px}
.health{position:absolute;right:12px;bottom:10px;z-index:6;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:#3c3020;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:999px}
.health i{display:block;width:54px;height:6px;border-radius:999px;background:#e6dcc7;overflow:hidden}
.health i b{display:block;height:100%;background:#8a6a2f}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.dry{background:var(--dry-soft);border-color:transparent}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px}
.dot{flex:1;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s}
.dot.on{background:var(--leaf);border-color:var(--leaf)}
.next{font-size:.88rem;color:var(--muted)}
.next b{color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.dry i{background:var(--dry)}

/* Goals */
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;transition:transform .12s,background .2s,border-color .2s}
.goal:active{transform:scale(.985)}
.goal .chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:all .2s}
.goal .chk svg{width:16px;height:16px;opacity:0}
.goal.done{background:var(--surface-2)}
.goal.done .chk{background:var(--leaf);border-color:var(--leaf)}
.goal.done .chk svg{opacity:1}
.goal.just .chk{animation:boing .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.goal .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.goal .qt b{font-weight:600;overflow-wrap:anywhere}
.goal.done .qt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.goal .qt small{color:var(--muted);font-size:.8rem}
.gi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.gi svg{width:22px;height:22px}
.g0{background:var(--eat)} .g1{background:var(--rest)} .g2{background:var(--move)} .g3{background:var(--mind)} .g4{background:var(--accent)}

/* Flower ladder: a dotted garden path from marigold to lily */
.ladder{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ladder::before{content:"";position:absolute;left:12%;right:12%;top:38px;border-top:3px dotted var(--line);z-index:0}
.rung{position:relative;z-index:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rung svg{width:50px;height:58px}
.rung b{font-size:.8rem;font-weight:700;line-height:1.2}
.rung small{font-size:.72rem;color:var(--muted);line-height:1.25}
.rung .xpv{font-size:.74rem;font-weight:700;color:var(--leaf)}
.rung.locked svg{filter:grayscale(1);opacity:.35}
.rung.locked{background:var(--bg);border-style:dashed}
.rung.next{border-color:var(--accent);border-style:solid}

/* Lists */
.board{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rk{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.me{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.row.me .rk{color:var(--accent)}
.row .xp{font-weight:700;font-variant-numeric:tabular-nums}
.zone{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);padding:6px 4px 2px}
.buddy{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.buddy:last-child{border-bottom:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff;background:var(--leaf)}
.av.lg{width:56px;height:56px;font-size:1.4rem}
.buddy .bt{flex:1;min-width:0}
.buddy .bt small{display:block;color:var(--muted);font-size:.82rem}
.bstreak{font-family:var(--f-display);font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bstreak svg{width:18px;height:18px}
.glist{display:flex;flex-direction:column}
.gline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gline:last-child{border-bottom:0}
.gline .bt{flex:1;min-width:0;overflow-wrap:anywhere}
.gline .bt small{display:block;color:var(--muted);font-size:.8rem}

/* Buttons and inputs */
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .1s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 11px;font-size:.84rem}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.danger{background:var(--eat);color:#fff;box-shadow:none}
.btn.wide{width:100%;padding:13px 16px;font-size:1rem}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:1rem}
.input:focus{border-color:var(--leaf)}
.inrow{display:flex;gap:8px}
.inrow .input{flex:1;min-width:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.choice .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.choice .qt b{font-weight:600;overflow-wrap:anywhere}
.choice .qt small{color:var(--muted);font-size:.8rem}
.choice .tick{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.choice .tick svg{width:14px;height:14px;opacity:0}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.choice[aria-pressed="true"] .tick{background:var(--leaf);border-color:var(--leaf)}
.choice[aria-pressed="true"] .tick svg{opacity:1}
.fineprint{font-size:.78rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.howto{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}

/* You */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.cal .c.full{background:var(--leaf);border-color:var(--leaf)}
.cal .c.rec{background:var(--leaf-soft);border-color:var(--leaf)}
.cal .c.miss{background:var(--dry);border-color:var(--dry)}
.cal .c.today{outline:2px solid var(--accent);outline-offset:1px}
.cal .c.future,.cal .c.pre{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.profile{display:flex;align-items:center;gap:14px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--leaf);background:var(--leaf-soft)}

/* Sheet, toast, celebration */

<script>
(function(){
"use strict";
/* ---------- Game rules ----------
   EARN   Every goal pays XP by difficulty (Easy 10, Steady 20, Hard 35). Finishing every goal adds a 25 XP day bonus,
          and the whole day is multiplied by the streak multiplier: x1.1 compounding per consecutive goal day, capped at x10.
          A missed day resets the multiplier to x1.
   BUILD  XP is spent in the Shop. The Greenhouse (the town hall) gates plots, buildings and flowers.
          Water Well lowers drying on missed days. Beehive boosts flower harvest.
   GROW   Flowers (marigold 1, sunflower 5, red rose 20, pink lily 30 XP) fill a harvest basket on every goal day; tap to collect.
          Sunflower unlocks after 5 goal days in a row, red rose after 10 more, pink lily after 20 more.
   DRY    A missed day dries every flower by 35% (less with a Well). 3 goal days restore 100%; no new flowers meanwhile. */
const DIFF = {easy:{name:"Easy",xp:10}, steady:{name:"Steady",xp:20}, hard:{name:"Hard",xp:35}};
const DAY_BONUS = 25, MULT_STEP = 1.1, MULT_CAP = 10, RECOVERY_DAYS = 3;
const mult = s => s<=0 ? 1 : Math.min(MULT_CAP, Math.pow(MULT_STEP, s-1));
const fmtM = m => "×"+(m<10?m.toFixed(1):"10");
const FLOWERS = {
  marigold: {name:"Marigold",  xp:1,  cost:20,  hall:1, power:1},
  sunflower:{name:"Sunflower", xp:5,  cost:80,  hall:2, power:4, tall:true},
  rose:     {name:"Red rose",  xp:20, cost:300, hall:3, power:12},
  lily:     {name:"Pink lily", xp:30, cost:600, hall:4, power:25, tall:true}
};
const ORDER = ["marigold","sunflower","rose","lily"];
const NEEDS = [0,5,10,20];
const DECOR = {
  stone:   {name:"Stepping stones", cost:40,  hall:1, power:2,  note:"A path through the beds"},
  lantern: {name:"Moon lantern",    cost:60,  hall:1, power:3,  note:"Glows after dusk"},
  birdbath:{name:"Bird bath",       cost:150, hall:2, power:6,  note:"A sparrow drops by"},
  swing:   {name:"Garden swing",    cost:400, hall:3, power:12, note:"For slow evenings", wide:true}
};
const BUILD = {
  hall:{name:"Greenhouse", desc:"The heart of your garden. Each level opens plots, buildings and flowers.", base:1, max:5, cost:[0,0,150,500,1200,2500], req:[0,0,0,0,0,0],
        effect:l=>`${HALL_PLOTS[l]} plots · ${ORDER.filter(f=>FLOWERS[f].hall<=l).map(f=>FLOWERS[f].name.toLowerCase()).join(", ")}`},
  well:{name:"Water well", desc:"Your defence against dry days.", base:0, max:3, cost:[0,200,600,1500], req:[0,2,3,4],
        effect:l=>l?`Missed days dry flowers by ${dryRate(l)}%`:`Missed days dry flowers by 35%`},
  hive:{name:"Beehive", desc:"Bees make every flower harvest more.", base:0, max:3, cost:[0,250,700,1800], req:[0,2,3,5],
        effect:l=>l?`+${l*15}% flower harvest`:`No harvest bonus`}
};
const HALL_PLOTS = [0,4,8,12,16,20], PLOTS = 20;
const dryRate = wellLvl => 35-5*wellLvl;
const PRESETS = [
  {id:"nosugar", t:"No added sugar today",       sub:"Skip sweets, desserts and sugary drinks", icon:"cup",  diff:"hard"},
  {id:"makeup",  t:"Remove makeup before sleep", sub:"Cleanse your face before bed",            icon:"moon", diff:"easy"},
  {id:"steps",   t:"Walk 10,000 steps",          sub:"A long walk, or a commute on foot",       icon:"shoe", diff:"steady"}
];
const STORE = "tamanna-garden-v3";

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function realToday(){ const d=new Date(); d.setHours(12,0,0,0); return d; }
function today(){ const d=realToday(); d.setDate(d.getDate()+((S&&S.offset)||0)); return d; }
function addDays(k,n){ const [y,m,dd]=k.split("-").map(Number); const d=new Date(y,m-1,dd,12); d.setDate(d.getDate()+n); return key(d); }
const T = () => key(today());
function fmtDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
const fmtN = n => n.toLocaleString("en-IN");

/* ---------- Storage: a small on-device database of registered gardeners ---------- */
function blankDB(){ return {v:3, current:null, users:{}}; }
function loadDB(){ try{ const raw=localStorage.getItem(STORE); if(raw){ const p=JSON.parse(raw); if(p&&p.v===3&&p.users) return p; } }catch(e){} return null; }
function saveDB(){ try{ localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
let DB = loadDB() || blankDB();
let S = DB.current ? DB.users[DB.current] : null;

function newUser(name, goals){
  const t=key(realToday());
  return {id:"u"+Date.now().toString(36), name, created:t, start:t, offset:0,
    goals:goals.map(g=>({...g, from:t})), log:{}, full:{}, items:[], upg:[], spent:0, collected:0};
}
function sampleUser(){
  const t=key(realToday()), st=addDays(t,-17);
  const u={id:"sample", name:"Asha", sample:true, created:st, start:st, offset:0,
    goals:[
      {id:"nosugar",t:PRESETS[0].t,icon:"cup", diff:"hard",  from:st},
      {id:"makeup", t:PRESETS[1].t,icon:"moon",diff:"easy",  from:st},
      {id:"steps",  t:PRESETS[2].t,icon:"shoe",diff:"steady",from:st},
      {id:"cread",  t:"Read 10 pages before bed",custom:true,diff:"steady",from:st}
    ], log:{}, full:{}, items:[], upg:[], spent:0, collected:0};
  const ids=u.goals.map(g=>g.id);
  for(let i=17;i>=1;i--){ const k=addDays(t,-i); u.log[k]=ids.slice(); u.full[k]=true; }
  u.log[t]=["makeup"];
  const U=(b,ago)=>{ u.upg.push({b,d:addDays(t,-ago)}); };
  const I=(plot,k,ago)=>{ u.items.push({plot,k,on:addDays(t,-ago),off:null}); };
  U("hall",15); U("hall",10); U("well",9); U("hive",8);
  I(5,"marigold",17); I(6,"marigold",16); I(0,"marigold",16); I(1,"lantern",15);
  I(2,"sunflower",12); I(7,"sunflower",11); I(8,"sunflower",9); I(3,"sunflower",7);
  I(10,"birdbath",6); I(11,"stone",5); I(4,"rose",2);
  u.spent = 150+500+200+250 + 3*20+60 + 4*80 + 150+40 + 300;
  return u;
}

/* ---------- Derived state: replayed from the log so every number stays consistent ---------- */
const liveGoals = () => S.goals.filter(g=>!g.removed);
const activeGoals = (k=T()) => liveGoals().filter(g=>g.from<=k);
const doneList = k => S.log[k]||[];
const goalXP = id => { const g=S.goals.find(x=>x.id===id); return g?DIFF[g.diff||"steady"].xp:0; };
function refreshToday(){ const k=T(), g=activeGoals(k); S.full[k] = g.length>0 && g.every(x=>doneList(k).includes(x.id)); }
const lvl = (b, d) => BUILD[b].base + S.upg.filter(u=>u.b===b && (!d || u.d<=d)).length;
const itemsOn = d => S.items.filter(f=>f.on<=d && (!f.off || d<f.off));
const current = () => S.items.filter(f=>!f.off);
const atPlot = i => S.items.find(f=>f.plot===i && !f.off) || null;
const isFlower = k => !!FLOWERS[k];
const yieldOf = list => list.reduce((a,f)=>a+(isFlower(f.k)?FLOWERS[f.k].xp:0),0);

function sim(){
  const t=T();
  let health=100, rec=null, streak=0, best=0, since=0, tier=0, earned=0, harvest=0;
  const days={};
  for(let d=S.start, i=0; d<=t && i<3000; d=addDays(d,1), i++){
    const full=!!S.full[d], base=doneList(d).reduce((a,id)=>a+goalXP(id),0);
    if(d===t && !full){ earned+=base; days[d]={partial:true,dx:base}; break; }
    if(full){
      streak++; since++; best=Math.max(best,streak);
      const m=mult(streak), dx=Math.round((base+DAY_BONUS)*m);
      earned+=dx;
      const recovering=!!rec;
      if(rec){ rec.left--; health = rec.left===0?100:Math.round(rec.from+(100-rec.from)*(RECOVERY_DAYS-rec.left)/RECOVERY_DAYS); if(!rec.left) rec=null; }
      if(tier<3 && since>=NEEDS[tier+1]){ tier++; since=0; }
      const hv=Math.round(yieldOf(itemsOn(d))*health/100*(1+.15*lvl("hive",d)));
      harvest+=hv;
      days[d]={full:true,base,dx,m,hv,health,recovering};
    } else {
      earned+=base; streak=0; since=0;
      health=Math.max(0,health-dryRate(lvl("well",d))); rec={left:RECOVERY_DAYS,from:health};
      days[d]={miss:true,dx:base,health};
    }
  }
  const todayFull=!!S.full[t], todayRec=days[t]&&days[t].recovering;
  return {health,rec,streak,best,since,tier,earned,harvest,days,
    wallet:earned+S.collected-S.spent, basket:harvest-S.collected,
    nextM: mult(streak+1), blocked: !!rec || !!todayRec, todayFull};
}
function power(){
  let p=lvl("hall")*20+lvl("well")*10+lvl("hive")*10;
  current().forEach(f=>{ p+= (FLOWERS[f.k]||DECOR[f.k]).power; });
  return p;
}
const hallLvl = () => lvl("hall");
const openPlots = () => HALL_PLOTS[hallLvl()];
const freePlot = () => { for(let i=0;i<openPlots();i++) if(!atPlot(i)) return i; return -1; };
const harvestRate = st => Math.round(yieldOf(current())*st.health/100*(1+.15*lvl("hive")));
function weekStart(){ const d=today(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return key(d); }
const daysIntoWeek = () => (today().getDay()+6)%7+1;

/* Why an item can't be bought right now, or "" when it can. */
function flowerBlock(f, st){
  const F=FLOWERS[f], i=ORDER.indexOf(f);
  if(hallLvl()<F.hall) return `Greenhouse ${F.hall}`;
  if(i>st.tier) return i===st.tier+1 ? `${NEEDS[i]-st.since} more streak days` : `Unlock ${FLOWERS[ORDER[i-1]].name.toLowerCase()} first`;
  if(st.blocked) return "Garden recovering";
  return "";
}
function decorBlock(k){ return hallLvl()<DECOR[k].hall ? `Greenhouse ${DECOR[k].hall}` : ""; }
function buildBlock(b){
  const B=BUILD[b], l=lvl(b);
  if(l>=B.max) return "max";
  if(hallLvl()<B.req[l+1]) return `Greenhouse ${B.req[l+1]}`;
  return "";
}
function affordableUpgrade(st){
  for(const b of ["hall","well","hive"]){ const l=lvl(b); if(!buildBlock(b) && st.wallet>=BUILD[b].cost[l+1]) return b; }
  return null;
}

/* ---------- Illustrations ---------- */
const G="#4b993f";
const mound = () => `<ellipse cx="30" cy="75" rx="10" ry="3.6" fill="#5a3b24"/>`;
const stem = (h,w=2.4,b=75) => `<path d="M30 ${b} Q27 ${b-h*.5} 30 ${b-h}" stroke="${G}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const leaf = (x,y,r,s=1,c="#5aae45") => `<ellipse cx="${x}" cy="${y}" rx="${(6*s).toFixed(1)}" ry="${(2.5*s).toFixed(1)}" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`;
function ring(cx,cy,n,rad,fn){ let o=""; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; o+=fn(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad, i*360/n); } return o; }
const DRAW = {
  marigold(){
    return mound()+stem(30)+leaf(24,62,-30)+leaf(36,56,30)+leaf(25,52,-20,.8)+

/* ---------- Scene: the garden base ---------- */
function tod(){ const h=new Date().getHours(); return h>=5&&h<8?"dawn":h>=8&&h<17?"day":h>=17&&h<19?"dusk":"night"; }
let placing=null;   // {k} while the player chooses a plot for a purchase
function scene(st, interactive){
  const t=tod(), dry=st.health<100, open=openPlots();
  let tiles="";
  for(let i=0;i<PLOTS;i++){
    const z=`style="z-index:${Math.floor(i/5)+1}"`, p=atPlot(i);
    if(i>=open){
      const need=HALL_PLOTS.findIndex(n=>n>i);
      tiles+= interactive ? `<button class="plot locked" data-locked="${need}" ${z} aria-label="Locked plot. Greenhouse level ${need} opens it"><span class="tufts"></span><span class="lock">Lv ${need}</span></button>`
                          : `<div class="plot locked" ${z}><span class="tufts"></span></div>`;
      continue;
    }
    if(!p){
      tiles+= interactive
        ? `<button class="plot empty ${placing?"target":""}" data-plot="${i}" ${z} aria-label="Empty plot ${i+1}"><span class="soil"></span>${!placing?`<span class="add">+</span>`:""}</button>`
        : `<div class="plot empty" ${z}><span class="soil"></span></div>`;
      continue;
    }
    const fl=isFlower(p.k), def=fl?FLOWERS[p.k]:DECOR[p.k];
    const svg=itemSVG(p.k, "plant "+(fl?(def.tall?"tall":""):"decor "+(def.wide?"wide":"")), fl?dryStyle(st.health):"");
    tiles+= interactive
      ? `<button class="plot" data-plot="${i}" ${z} aria-label="${def.name}${fl?`, ${st.health}% health`:""}"><span class="soil"></span>${svg}</button>`
      : `<div class="plot" ${z}><span class="soil"></span>${svg}</div>`;
  }
  let blds="";
  ["well","hall","hive"].forEach(b=>{
    const l=lvl(b), canUp=!buildBlock(b) && st.wallet>=BUILD[b].cost[l+1];
    if(!l && buildBlock(b)) return;               // not yet available
    const inner = (l?BSVG[b](l):BSVG[b](1)) + (l?`<span class="lvb ${canUp?"up":""}">${canUp?"↑":l}</span>`:`<span class="bsign">Build</span>`);
    blds += interactive ? `<button class="bld ${b} ${l?"":"ghost"}" data-bld="${b}" aria-label="${BUILD[b].name}${l?`, level ${l}`:", not built"}">${inner}</button>`
                        : `<span class="bld ${b} ${l?"":"ghost"}">${inner}</span>`;
  });
  let vis="";
  if(st.todayFull && !dry) [["8%","40%","0s","#f2884b","#ffd36b"],["46%","30%","-3s","#9b7be0","#d6c6ff"],["66%","58%","-6s","#4fb3d9","#c9ecf7"]].forEach(([l,tp,dl,a,b])=>vis+=`<span class="visitor bfly" style="left:${l};top:${tp};animation-delay:${dl}">${butterflySVG(a,b)}</span>`);
  let note="";
  if(st.rec) note=`<span class="scene-note warn">Drying out · ${st.health}%</span>`;
  else if(placing) note=`<span class="scene-note">Tap a glowing plot</span>`;
  const bubble = interactive && st.basket>0 ? `<button class="collect" data-act="collect">${basketIcon()}Collect ${fmtN(st.basket)}</button>` : "";
  const health = `<span class="health" aria-label="Garden health ${st.health}%">${dropIcon().replace("<svg ",'<svg style="width:12px;height:12px;color:#3d8fc2" ')}<i><b style="width:${st.health}%"></b></i><span class="num">${st.health}%</span></span>`;
  return `<div class="scene tod-${t} ${dry?"dry":""} ${interactive?"interactive big":""}">
    <div class="sky base"><div class="stars"></div><div class="orb"></div><div class="hill h1"></div><div class="hill h2"></div>${blds}</div>
    <div class="bed">${tiles}</div>${vis}${note}${bubble}${health}</div>`;
}

let tab="today", justToggled=null;
function topBar(st){
  return `<header class="top">
    <div class="brand">${sproutIcon("var(--leaf)")}Tamanna</div>
    <div class="pills">
      <span class="pill streak ${st.streak?"":"cold"}" title="Streak and XP multiplier">${sproutIcon()}<span class="num">${st.streak}</span><span class="mult num">${fmtM(st.todayFull?mult(st.streak):st.nextM)}</span></span>
      <span class="pill xp" title="XP to spend">${starIcon()}<span class="num">${fmtN(st.wallet)}</span><span class="sr">XP</span></span>
      <button class="help" data-act="how" aria-label="How Tamanna works">?</button>
    </div></header>`;
}
function greeting(){ const h=new Date().getHours(); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
function multCard(st){
  const s0 = st.todayFull ? st.streak : st.streak+1;     // the day the first bar represents
  const vals=[...Array(7)].map((_,i)=>mult(s0+i)), top=Math.max(...vals);
  const bars=vals.map((m,i)=>`<span class="${i===0?"now":""}"><span>${i===0||i===6?fmtM(m):""}</span><i style="height:${Math.max(10,m/top*100).toFixed(0)}%"></i><span>${i===0?(st.todayFull?"Today":"Today"):"+"+i}</span></span>`).join("");
  return `<section class="mcard"><div class="sec-h"><div><span class="eyebrow">Streak multiplier</span><div class="mx">${fmtM(vals[0])}</div></div>
      <p class="next" style="max-width:24ch;text-align:right">${st.todayFull?`Locked in for today. Tomorrow ${fmtM(vals[1])}.`:(vals[0]<1.05?`Finish every goal to start your streak. Tomorrow it grows to ${fmtM(vals[1])}.`:`Finish every goal today to earn ${fmtM(vals[0])} on all of it.`)}</p></div>
    <div class="mbars" aria-hidden="true">${bars}</div>
    <p class="fineprint">Each day in a row multiplies your XP by another ×1.1, up to ×10. Miss a day and it drops back to ×1.</p></section>`;
}
function nudge(st){
  if(st.rec) return `<div class="nudge dry" role="status">${dropIcon().replace("<svg ",'<svg class="fl" style="color:var(--dry);width:34px;height:34px" ')}<span class="bt"><b>Your flowers are drying · ${st.health}%</b><small>Finish your goals ${plural(st.rec.left,"more day")} to revive them. No new flowers until then.</small><span class="meter"><i style="width:${st.health}%"></i></span></span></div>`;
  if(st.basket>0) return `<button class="nudge" data-go="garden">${basketIcon().replace("<svg ",'<svg class="fl" style="width:40px;height:40px" ')}<span class="bt"><b>${fmtN(st.basket)} XP of harvest is waiting</b><small>Your flowers have been busy. Tap to collect it.</small></span><span class="go" aria-hidden="true">›</span></button>`;
  const b=affordableUpgrade(st);
  if(b){ const l=lvl(b); return `<button class="nudge" data-go="shop">${BSVG[b](Math.max(1,l)).replace("<svg ",'<svg class="fl" style="width:44px;height:40px" ')}<span class="bt"><b>You can ${l?"upgrade":"build"} the ${BUILD[b].name.toLowerCase()}</b><small>${l?`Level ${l+1}: `:""}${BUILD[b].effect(l+1)}</small></span><span class="go" aria-hidden="true">›</span></button>`; }
  return "";
}
function todayView(st){
  const goals=activeGoals(), list=doneList(T()), n=goals.filter(g=>list.includes(g.id)).length;
  const d=st.days[T()]||{};
  const sub = st.todayFull ? `Goal day done. You earned ${fmtN(d.dx||0)} XP today.` : `${plural(goals.length-n,"goal")} to go today.`;
  const goalBtns = goals.length ? goals.map(g=>{
    const isDone=list.includes(g.id);
    return `<button class="goal ${isDone?"done":""} ${justToggled===g.id&&isDone?"just":""}" data-goal="${esc(g.id)}" aria-pressed="${isDone}"><span class="chk">${checkSVG}</span><span class="qt"><b>${esc(g.t)}</b><span class="diff">${DIFF[g.diff||"steady"].name}</span></span><span class="xpchip">+${DIFF[g.diff||"steady"].xp}</span><span class="gi ${goalCls(g)}">${goalIcon(g)}</span></button>`;
  }).join("") : `<p class="muted">Your new goals start tomorrow.</p>`;
  justToggled=null;
  return topBar(st)+
    `<section class="hello"><h1>${greeting()}, ${esc(S.name)}</h1><p>${sub}</p></section>
    ${nudge(st)}
    <section class="section"><div class="sec-h"><h2>Today's goals</h2><button class="btn small ghost" data-act="goals">Edit</button></div>${goalBtns}
      <p class="fineprint">All done adds a ${DAY_BONUS} XP bonus, then the streak multiplier applies to the whole day.</p></section>
    ${multCard(st)}
    <button class="scene-link" data-go="garden" aria-label="Open your garden">${scene(st,false)}</button>`;
}
function gardenView(st){
  const place = placing ? `<div class="placing" role="status">${itemSVG(placing.k)}<span class="bt">Placing a ${(FLOWERS[placing.k]||DECOR[placing.k]).name.toLowerCase()} for ${(FLOWERS[placing.k]||DECOR[placing.k]).cost} XP. Tap a glowing plot.</span><button class="btn small ghost" data-act="cancel-place">Cancel</button></div>` : "";
  return topBar(st)+place+scene(st,true)+
    `<div class="chips">
      <span class="chip">${crownIcon().replace("<svg ",'<svg style="width:14px;height:14px;color:var(--accent)" ')}${fmtN(power())} power</span>
      <span class="chip">Greenhouse Lv ${hallLvl()}</span>
      <span class="chip">${current().length} of ${openPlots()} plots</span>
      <span class="chip">${harvestRate(st)} XP harvest / goal day</span>
    </div>
    <p class="muted" style="margin-top:-8px">Tap a building to upgrade it, or a plot to plant. Flowers fill your basket on every goal day.</p>
    <button class="btn leaf wide" data-go="shop">Open the shop</button>`;

function shopCard({art, name, sub, block, cost, data, wallet, maxed}){
  let action;
  if(maxed) action=`<span class="req">Max level</span>`;
  else if(block) action=`<span class="req">${block}</span>`;
  else action=`<button class="btn small ${wallet>=cost?"leaf":"ghost"}" ${data} ${wallet>=cost?"":"disabled"}>${starIcon()}${fmtN(cost)}</button>`;
  return `<div class="sitem ${block&&!maxed?"locked":""} ${maxed?"max":""}"><span class="art">${art}</span><b>${name}</b><small>${sub}</small>${action}</div>`;
}
function shopView(st){
  const w=st.wallet;
  const blds=["hall","well","hive"].map(b=>{
    const B=BUILD[b], l=lvl(b), blk=buildBlock(b), maxed=blk==="max";
    return shopCard({art:BSVG[b](Math.max(1,maxed?l:l+1)), name:`${B.name}${maxed?` · Lv ${l}`:l?` · Lv ${l} → ${l+1}`:""}`, sub:maxed?B.effect(l):B.effect(l+1), block:maxed?"":blk, maxed, cost:maxed?0:B.cost[l+1], data:`data-upgrade="${b}"`, wallet:w});
  }).join("");
  const fls=ORDER.map(f=>{ const F=FLOWERS[f]; return shopCard({art:itemSVG(f), name:F.name, sub:`${F.xp} XP harvest per goal day`, block:flowerBlock(f,st), cost:F.cost, data:`data-buy="${f}"`, wallet:w}); }).join("");
  const dec=Object.keys(DECOR).map(k=>{ const D=DECOR[k]; return shopCard({art:itemSVG(k), name:D.name, sub:`${D.note} · +${D.power} power`, block:decorBlock(k), cost:D.cost, data:`data-buy="${k}"`, wallet:w}); }).join("");
  return topBar(st)+
    `<div class="wallet"><div><span class="eyebrow">XP to spend</span><br><b>${fmtN(w)}</b></div><div style="text-align:right"><span class="eyebrow">Garden power</span><br><b style="color:var(--accent)">${fmtN(power())}</b></div></div>
    <section class="section"><div class="sec-h"><h2>Buildings</h2><span class="muted">The greenhouse unlocks the rest</span></div><div class="shop">${blds}</div></section>
    <section class="section"><div class="sec-h"><h2>Flowers</h2><span class="muted">${st.tier<3?`${FLOWERS[ORDER[st.tier+1]].name} in ${plural(NEEDS[st.tier+1]-st.since,"streak day")}`:"All unlocked"}</span></div><div class="shop">${fls}</div></section>
    <section class="section"><div class="sec-h"><h2>Decorations</h2><span class="muted">Add power and charm</span></div><div class="shop">${dec}</div></section>`;
}
/* Clan (simulated for the demo) */
function rnd(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return ((h>>>0)%10000)/10000; }
const NB=[["Meera","#c2557a"],["Kabir","#2e76b8"],["Ishita","#8a5fb5"],["Rohan","#c9701d"],["Zoya","#2f8a62"],["Aarav","#b2493a"],["Dev","#4a6fa5"],["Tara","#7b8a2e"]];
const friendDone = (n,k) => rnd(n+"|"+k) < 0.86;
function buddyStreak(n){ let k=(S.full[T()]&&friendDone(n,T()))?T():addDays(T(),-1), c=0; for(let i=0;i<400;i++){ if(S.full[k]&&friendDone(n,k)) c++; else break; k=addDays(k,-1);} return c; }
function clanView(st){
  const wk=weekStart();
  const rows=NB.map(([n,c],i)=>({n,c,p:Math.round(30+rnd(n+wk)*190+i*6)})).concat([{n:"You",me:true,p:power()}]).sort((a,b)=>b.p-a.p);
  const board=rows.map((r,i)=>(i===3?`<div class="zone" style="color:var(--muted)">Safe zone</div>`:"")+`<div class="row ${r.me?"me":""}"><span class="rk">${i+1}</span><span>${r.me?"<b>You</b>":r.n}</span><span class="xp">${crownIcon().replace("<svg ",'<svg style="width:13px;height:13px;color:var(--accent);vertical-align:-1px" ')} ${fmtN(r.p)}</span></div>`).join("");
  const buddies=[NB[0],NB[1]].map(([n,c])=>{
    const bs=buddyStreak(n), fd=friendDone(n,T());
    return `<div class="buddy"><span class="av" style="background:${c}">${n[0]}</span><div class="bt"><b>${n}</b><small>${fd?"Done for today":"Not done yet"}</small></div><span class="bstreak" title="Shared streak">${sproutIcon()}<span>${bs}</span></span><button class="btn small ghost" data-nudge="${n}" data-done="${fd?1:0}">${fd?"Send seed":"Nudge"}</button></div>`;
  }).join("");
  return topBar(st)+
    `<section class="section card"><div class="sec-h"><h2>Marigold League</h2><span class="muted">Ranked by garden power</span></div>
      <div class="zone">Top three move up to Lily League</div>
      <div class="board">${board}</div></section>
    <section class="section card"><div class="sec-h"><h2>Buddy streaks</h2><span class="muted">Grow when you both finish</span></div><div>${buddies}</div></section>
    <p class="fineprint">Clan members here are simulated for the demo. Garden power adds up your buildings, flowers and decorations.</p>`;
}

function youView(st){
  const goodDays=Object.keys(st.days).filter(k=>st.days[k].full).length;
  const start=addDays(weekStart(),-28), t=T();
  let cal=["M","T","W","T","F","S","S"].map(d=>`<span class="wd">${d}</span>`).join("");
  for(let i=0;i<35;i++){
    const k=addDays(start,i), d=st.days[k];
    const c = k>t?"future": k<S.start?"pre": d&&d.miss?"miss": d&&d.full&&d.recovering?"rec": d&&d.full?"full":"";
    cal+=`<span class="c ${c} ${k===t?"today":""}" title="${fmtDate(k)}${d&&d.miss?": missed":d&&d.full?`: ${d.dx} XP at ${fmtM(d.m)}`:""}"></span>`;
  }
  const others=Object.values(DB.users).filter(u=>u.id!==S.id).length;
  const row=(act,icon,title,sub)=>`<button class="mrow" data-act="${act}"><span class="mi">${icon}</span><span class="bt"><b>${title}</b><small>${sub}</small></span><span class="chev" aria-hidden="true">›</span></button>`;
  return topBar(st)+
    `<section class="profile"><span class="av lg">${esc((S.name||"G")[0].toUpperCase())}</span><div><h1>${esc(S.name)}</h1><p class="muted">Greenhouse Lv ${hallLvl()} · since ${fmtDate(S.created)}</p></div></section>
    <section class="stats">
      <div class="stat"><b>${st.streak}</b><span>Current streak</span></div>
      <div class="stat"><b>${st.best}</b><span>Best streak</span></div>

      <div class="legend"><span><i style="background:var(--leaf)"></i>Goal day</span><span><i style="background:var(--leaf-soft);border:1px solid var(--leaf)"></i>Recovering</span><span><i style="background:var(--dry)"></i>Missed</span></div></section>
    <nav class="menu" aria-label="Settings">

      ${row("accounts",ICON.people,"Gardeners on this device",others?`${others+1} gardeners · switch or add`:"Add a gardener or open the sample")}
    </nav>`;
}

/* ---------- Feedback ---------- */
let toastTimer;
function toast(msg, k){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status");
  el.innerHTML=(k&&DRAW[k]?itemSVG(k):"")+`<span>${msg}</span>`;
  document.body.appendChild(el); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(),3000);
}
const reduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function petals(){
  if(reduced()) return;
  const box=document.createElement("div"); box.className="petals";
  const cols=["#f39a26","#e3711a","#f06f9e","#f5c518","#ffffff","#cf2239"];
  for(let i=0;i<46;i++){ const s=document.createElement("span"); s.style.left=(Math.random()*100)+"%"; s.style.background=cols[i%cols.length];
    s.style.setProperty("--dx",(Math.random()*120-60)+"px"); s.style.setProperty("--r",(Math.random()*720-360)+"deg");
    s.style.animationDuration=(2.4+Math.random()*2)+"s"; s.style.animationDelay=(Math.random()*.6)+"s"; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),5200);
}
function floatXP(text, x, y){
  if(reduced()) return;
  const el=document.createElement("span"); el.className="floatxp"; el.textContent=text;
  el.style.left=Math.max(8,x-30)+"px"; el.style.top=(y-20)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),1200);
}
let lastFocus=null, sheetKind=null;
function sheet(html, center){
  closeSheet(true);
  lastFocus=document.activeElement;
  const b=document.createElement("div"); b.className="backdrop"; b.id="sheet";
  b.innerHTML=`<div class="sheet ${center?"center":""}" role="dialog" aria-modal="true">${center?"":`<span class="grab"></span>`}${html}</div>`;
  b.addEventListener("click",e=>{ if(e.target===b) closeSheet(); });
  document.body.appendChild(b);
  const f=b.querySelector("button:not(:disabled)"); if(f) f.focus({preventScroll:true});
  return b;
}
function closeSheet(silent){ sheetKind=null; const s=document.getElementById("sheet"); if(s){ s.remove(); if(!silent && lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); } }

/* ---------- Actions ---------- */
function persist(){ if(S) DB.users[S.id]=S; saveDB(); }
function toggleGoal(id, el){
  const k=T(), before=sim(), wasFull=!!S.full[k];
  const list=S.log[k]||(S.log[k]=[]), adding=!list.includes(id);
  if(adding){ list.push(id); justToggled=id; } else list.splice(list.indexOf(id),1);
  refreshToday();
  const after=sim();
  if(after.wallet<0 || after.basket<0){            // that XP has already been spent
    if(adding) list.splice(list.indexOf(id),1); else list.push(id);
    refreshToday(); toast("You've already spent the XP from this goal, so it stays checked."); render(); return;
  }
  persist(); render();
  if(el){ const r=el.getBoundingClientRect(); if(adding) floatXP(`+${goalXP(id)}`, r.right-60, r.top); }
  if(!wasFull && S.full[k]) dayComplete(before);
  else if(wasFull && !S.full[k]) toast("Goal unmarked. Today no longer counts yet.");
}
function dayComplete(before){
  const st=sim(), d=st.days[T()]||{};
  let rewards="";
  if(st.tier>before.tier){ const f=ORDER[st.tier]; rewards+=`<div class="reward">${itemSVG(f)}<span><b>${FLOWERS[f].name} unlocked</b><br><small class="muted">${hallLvl()>=FLOWERS[f].hall?"Find it in the shop.":`Upgrade the greenhouse to level ${FLOWERS[f].hall} to plant it.`}</small></span></div>`; }
  if(d.recovering){
    rewards+= st.health>=100
      ? `<div class="reward leaf">${dropIcon().replace("<svg ",'<svg style="color:var(--frost);width:40px;height:40px" ')}<span><b>Back in full bloom</b><br><small class="muted">Your garden is at 100% again. You can plant after your next goal day.</small></span></div>`
      : `<div class="reward dry">${dropIcon().replace("<svg ",'<svg style="color:var(--dry);width:40px;height:40px" ')}<span><b>Recovering: ${st.health}%</b><br><small class="muted">${plural(st.rec?st.rec.left:0,"more goal day")} to full health.</small></span></div>`;
  }
  if(d.hv) rewards+=`<div class="reward leaf">${basketIcon().replace("<svg ",'<svg style="width:40px;height:40px" ')}<span><b>+${fmtN(d.hv)} XP in your basket</b><br><small class="muted">Collect it in the garden.</small></span></div>`;
  petals();
  sheet(`<div class="celebrate">
    <span class="eyebrow">Goal day complete</span>
    <span class="big">+${fmtN(d.dx||0)}</span>
    <h2>${st.streak===1?"Your streak has begun":`${st.streak} goal days in a row`}</h2>
    <span class="calc">(${d.base} + ${DAY_BONUS} bonus) ${fmtM(d.m||1)} = ${fmtN(d.dx||0)} XP</span>
    <p class="muted" style="max-width:34ch">Tomorrow's multiplier: ${fmtM(mult(st.streak+1))}.</p>
    ${rewards}
    <div class="sheet-row" style="width:100%"><button class="btn leaf" data-act="go-shop">Spend XP</button><button class="btn ghost" data-act="close">Close</button></div>
  </div>`, true);
}
function upgradeSheet(b){
  const st=sim(), B=BUILD[b], l=lvl(b), blk=buildBlock(b), maxed=blk==="max", cost=maxed?0:B.cost[l+1];
  sheet(`<div class="upgrade"><span class="art">${BSVG[b](Math.max(1,l))}</span><div style="min-width:0"><h2>${B.name}${l?` · Lv ${l}`:""}</h2><p class="muted">${B.desc}</p></div></div>
    ${maxed?`<div class="cmp"><span><b>Level ${l}</b>${B.effect(l)}</span></div><p class="muted">Fully upgraded.</p>`
      :`<div class="cmp"><span><b>${l?`Level ${l}`:"Now"}</b>${B.effect(l)}</span><span class="arrow">→</span><span><b>Level ${l+1}</b>${B.effect(l+1)}</span></div>`}
    <div class="sheet-row">${maxed?"":blk?`<button class="btn ghost" disabled>Needs ${blk}</button>`:`<button class="btn leaf" data-upgrade="${b}" ${st.wallet>=cost?"":"disabled"}>${l?"Upgrade":"Build"} · ${fmtN(cost)} XP</button>`}<button class="btn ghost" data-act="close">Close</button></div>
    ${!maxed&&!blk&&st.wallet<cost?`<p class="fineprint">You need ${fmtN(cost-st.wallet)} more XP.</p>`:""}`);
}
function upgrade(b){
  const st=sim(), l=lvl(b);
  if(buildBlock(b) || st.wallet<BUILD[b].cost[l+1]) return;
  S.spent+=BUILD[b].cost[l+1]; S.upg.push({b,d:T()});
  persist(); closeSheet(true); render(); petals();
  toast(`${BUILD[b].name} ${l?`upgraded to level ${l+1}`:"built"}! ${BUILD[b].effect(l+1)}.`);
}
function startBuy(k){
  const st=sim(), def=FLOWERS[k]||DECOR[k];
  const blk = isFlower(k)?flowerBlock(k,st):decorBlock(k);
  if(blk) return toast(`Not yet: ${blk}.`);
  if(st.wallet<def.cost) return toast(`You need ${fmtN(def.cost-st.wallet)} more XP.`);
  if(freePlot()<0) return toast(hallLvl()<5?"Every plot is full. Upgrade the greenhouse to open more.":"Every plot is full.");
  placing={k}; closeSheet(true); tab="garden"; render(); window.scrollTo({top:0});
}
function place(i){
  const k=placing&&placing.k; if(!k) return;
  const st=sim(), def=FLOWERS[k]||DECOR[k];
  if(atPlot(i) || i>=openPlots() || st.wallet<def.cost) return;
  if(isFlower(k) && flowerBlock(k,st)) return;
  S.items.push({plot:i,k,on:T(),off:null}); S.spent+=def.cost; placing=null;
  persist(); render(); toast(`${def.name} placed · +${def.power} power`, k);
}
function pickerSheet(i){
  const st=sim();
  const opt=k=>{ const fl=isFlower(k), def=fl?FLOWERS[k]:DECOR[k], blk=fl?flowerBlock(k,st):decorBlock(k), ok=!blk&&st.wallet>=def.cost;
    return `<button data-placeat="${i}" data-k="${k}" ${ok?"":"disabled"}>${itemSVG(k)}<b>${def.name}</b><small>${blk||`${fmtN(def.cost)} XP`}</small></button>`; };
  sheet(`<h2>Plant or decorate</h2><p class="muted">You have ${fmtN(st.wallet)} XP to spend.</p>
    <h3>Flowers</h3><div class="picks">${ORDER.map(opt).join("")}</div>
    <h3>Decorations</h3><div class="picks">${Object.keys(DECOR).map(opt).join("")}</div>`);
}
function plotSheet(i){
  if(placing){ if(!atPlot(i)) place(i); return; }
  const p=atPlot(i), st=sim();
  if(!p){ pickerSheet(i); return; }
  const fl=isFlower(p.k), def=fl?FLOWERS[p.k]:DECOR[p.k];
  const higher=fl?ORDER.filter(f=>ORDER.indexOf(f)>ORDER.indexOf(p.k) && !flowerBlock(f,st)):[];
  sheet(`<div style="display:flex;gap:14px;align-items:center"><span style="width:84px;height:96px;flex:none;background:var(--surface-2);border-radius:16px;display:grid;place-items:center;overflow:hidden">${itemSVG(p.k,"",`style="width:74px;height:90px;${fl&&st.health<100?`filter:saturate(${(.12+.88*st.health/100).toFixed(2)}) sepia(${((1-st.health/100)*.75).toFixed(2)})`:""}"`)}</span>
    <div style="min-width:0"><h2>${def.name}</h2><p class="muted" style="margin-top:4px">${fl?`Adds ${def.xp} XP to your basket on each goal day${st.health<100?` (${Math.round(def.xp*st.health/100)} at ${st.health}% health)`:""}.`:def.note+"."}</p><p class="fineprint" style="margin-top:4px">+${def.power} power · placed ${fmtDate(p.on)}</p></div></div>
    ${higher.length?`<h3>Replace with</h3><div class="picks">${higher.map(f=>`<button data-replace="${i}" data-k="${f}" ${st.wallet>=FLOWERS[f].cost?"":"disabled"}>${itemSVG(f)}<b>${FLOWERS[f].name}</b><small>${fmtN(FLOWERS[f].cost)} XP</small></button>`).join("")}</div>`:""}
    <button class="btn leaf" data-act="close">Done</button>`);
}
function replace(i,f){
  const st=sim(), cur=atPlot(i);
  if(!cur || !isFlower(cur.k) || flowerBlock(f,st) || st.wallet<FLOWERS[f].cost || ORDER.indexOf(f)<=ORDER.indexOf(cur.k)) return;
  cur.off=T(); S.items.push({plot:i,k:f,on:T(),off:null}); S.spent+=FLOWERS[f].cost;
  persist(); closeSheet(true); render(); toast(`${FLOWERS[f].name} planted`, f);
}
function collect(el){
  const st=sim(); if(st.basket<=0) return;
  const r=el?el.getBoundingClientRect():null;
  S.collected+=st.basket; persist(); render();
  if(r) floatXP(`+${fmtN(st.basket)}`, r.left+r.width/2, r.top);
  toast(`Collected ${fmtN(st.basket)} XP of harvest`);
}
function addGoal(text, diff, preset){
  const t=T(), from=addDays(t,1);
  if(preset){
    const p=PRESETS.find(x=>x.id===preset); if(!p) return;
    const old=S.goals.find(g=>g.id===p.id);
    if(old){ if(!old.removed) return; old.removed=false; old.from=from; } else S.goals.push({id:p.id,t:p.t,icon:p.icon,diff:p.diff,from});
    toast(`Added "${p.t}". It starts tomorrow.`);
  } else { const v=text.trim(); if(!v) return; S.goals.push({id:"c"+Date.now().toString(36),t:v,custom:true,diff:DIFF[diff]?diff:"steady",from}); toast(`Added "${esc(v)}". It starts tomorrow.`); }
  persist(); render();
  if(sheetKind==="goals") goalsSheet(!preset);
}
function removeGoal(id){
  if(liveGoals().length<=1) return;
  const g=S.goals.find(x=>x.id===id); if(!g) return;
  const before=sim(), wasFull=!!S.full[T()];
  g.removed=true; refreshToday(); persist(); render();
  if(sheetKind==="goals") goalsSheet();
  toast(`Removed "${esc(g.t)}"`);
  if(!wasFull && S.full[T()]) dayComplete(before);
}
function advance(){
  S.offset=(S.offset||0)+1; placing=null; persist(); render();
  const st=sim(), y=st.days[addDays(T(),-1)];
  if(y&&y.miss) toast(`A day was missed. Flowers dried to ${st.health}% and the multiplier reset to ×1.`);
  else toast(`A new day. Today's multiplier is ${fmtM(st.nextM)}.`);
}
function finishToday(){
  const k=T(), before=sim(); if(S.full[k]) return false;
  S.log[k]=activeGoals(k).map(g=>g.id); refreshToday(); persist(); render();
  if(S.full[k]) dayComplete(before);
  return true;
}
function fastForward(){
  const before=sim();
  for(let i=0;i<7;i++){
    if(i>0) S.offset=(S.offset||0)+1;
    const k=T(); S.log[k]=activeGoals(k).map(g=>g.id); refreshToday();
  }
  persist(); render();
  const st=sim(), gained=st.earned-before.earned;
  toast(`A week of goal days: +${fmtN(gained)} XP. Multiplier now ${fmtM(mult(st.streak))}.`, st.tier>before.tier?ORDER[st.tier]:null);
}
function createUser(){
  const goals=reg.picks.map(id=>{ const p=PRESETS.find(x=>x.id===id); return {id:p.id,t:p.t,icon:p.icon,diff:p.diff}; })
    .concat(reg.custom.map((c,i)=>({id:"c"+Date.now().toString(36)+i,t:c.t,diff:c.diff,custom:true})));
  if(!goals.length) return;
  const u=newUser(reg.name.trim()||"Gardener", goals);
  DB.users[u.id]=u; DB.current=u.id; S=u; registering=false; addingOther=false;
  reg={name:"",picks:["nosugar"],custom:[]};
  persist(); go("today");
  toast(`Welcome, ${esc(u.name)}. Finish today's goals to earn your first XP.`, "marigold");
}
function switchTo(id){ if(!DB.users[id]) return; DB.current=id; S=DB.users[id]; registering=false; placing=null; persist(); go("today"); toast(`Switched to ${esc(S.name)}`); }

document.addEventListener("input",e=>{ if(e.target.id==="reg-name") reg.name=e.target.value; });
document.addEventListener("submit",e=>{
  const f=e.target.closest("form"); if(!f) return; e.preventDefault();
  const v=(f.elements.goal&&f.elements.goal.value)||"", diff=(f.elements.diff&&f.elements.diff.value)||"steady";
  if(f.dataset.form==="reg-other"){ const t=v.trim(); if(t){ reg.custom.push({t,diff}); render(); const i=document.getElementById("other-reg"); if(i) i.focus(); } }
  else if(f.dataset.form==="profile"){ addGoal(v, diff); }
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t||t.disabled) return;
  const ds=t.dataset;
  if(ds.tab){ go(ds.tab); return; }
  if(ds.go){ go(ds.go); return; }
  if(ds.goal){ toggleGoal(ds.goal, t); return; }
  if(ds.plot!==undefined){ plotSheet(+ds.plot); return; }
  if(ds.locked){ sheet(`<h2>Locked plot</h2><p class="muted">Upgrade the greenhouse to level ${ds.locked} to open this plot.</p><div class="sheet-row"><button class="btn leaf" data-bld="hall">See the greenhouse</button><button class="btn ghost" data-act="close">Close</button></div>`); return; }
  if(ds.bld){ upgradeSheet(ds.bld); return; }
  if(ds.upgrade){ upgrade(ds.upgrade); return; }
  if(ds.buy){ startBuy(ds.buy); return; }
  if(ds.placeat){ placing={k:ds.k}; closeSheet(true); place(+ds.placeat); return; }
  if(ds.replace){ replace(+ds.replace, ds.k); return; }
  if(ds.pick){ const id=ds.pick; reg.picks=reg.picks.includes(id)?reg.picks.filter(x=>x!==id):reg.picks.concat(id); render(); const b=document.querySelector(`[data-pick="${id}"]`); if(b) b.focus({preventScroll:true}); return; }
  if(ds.unpick!==undefined){ reg.custom.splice(+ds.unpick,1); render(); return; }
  if(ds.addpreset){ addGoal("", null, ds.addpreset); return; }
  if(ds.delgoal){ removeGoal(ds.delgoal); return; }
  if(ds.switch){ closeSheet(true); switchTo(ds.switch); return; }
  if(ds.nudge){ toast(ds.done==="1"?`Marigold seed sent to ${ds.nudge}`:`Nudge sent to ${ds.nudge}`, ds.done==="1"?"marigold":null); return; }
  const a=ds.act; if(!a) return;
  if(a==="close"){ closeSheet(); }
  else if(a==="collect"){ collect(t); }
  else if(a==="cancel-place"){ placing=null; render(); }
  else if(a==="go-shop"){ closeSheet(true); go("shop"); }
  else if(a==="how"){ howSheet(); }
  else if(a==="goals"){ goalsSheet(); }
  else if(a==="demo"){ demoSheet(); }
  else if(a==="accounts"){ confirmDelete=false; accountsSheet(); }
  else if(a==="other"){ addingOther=!addingOther; render(); if(addingOther){ const i=document.getElementById("other-reg"); if(i) i.focus(); } }
  else if(a==="create"){ createUser(); }
  else if(a==="register"){ closeSheet(true); registering=true; addingOther=false; render(); window.scrollTo({top:0}); }
  else if(a==="cancel-reg"){ registering=false; render(); }
  else if(a==="sample"){ closeSheet(true); const u=sampleUser(); DB.users[u.id]=u; switchTo(u.id); }
  else if(a==="finish"){ closeSheet(true); if(!finishToday()) toast("Today's goals are already done."); }
  else if(a==="tomorrow"){ closeSheet(true); advance(); }
  else if(a==="ff7"){ closeSheet(true); fastForward(); }
  else if(a==="del"){ confirmDelete=true; accountsSheet(); }
  else if(a==="del-no"){ confirmDelete=false; accountsSheet(); }
  else if(a==="del-yes"){
    closeSheet(true);
    const name=S.name; delete DB.users[S.id]; confirmDelete=false; placing=null;
    const next=Object.keys(DB.users)[0];
    if(next){ DB.current=next; S=DB.users[next]; persist(); go("today"); }
    else { DB.current=null; S=null; saveDB(); registering=true; render(); }
    toast(`${esc(name)}'s garden was deleted`);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(document.getElementById("sheet")) closeSheet(); else if(placing){ placing=null; render(); } } });

if(S){ refreshToday(); persist(); }
render();
setInterval(()=>{ const sc=document.querySelector(".scene"); if(sc && !document.getElementById("sheet")){ const c="tod-"+tod(); if(!sc.classList.contains(c)) render(); } }, 60000);
})();
</script>
