<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tamanna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-shaped column; the living garden is the hero of every screen; fixed bottom tab bar. */
:root{
  --bg:#edf2ea; --surface:#ffffff; --surface-2:#f5f8f2; --ink:#1c2a21; --muted:#5b6b60; --line:#d6e0d4;
  --accent:#d4700f; --accent-ink:#ffffff; --accent-soft:#fbe7d0;
  --leaf:#2f7d4c; --leaf-soft:#dcefdf;
  --eat:#c84d38; --move:#2e76b8; --rest:#6553bd; --mind:#2f8a62;
  --dry:#a7793f; --dry-soft:#f3e6d2;
  --frost:#3d8fc2;
  --shadow:0 1px 2px rgba(28,42,33,.06),0 8px 24px rgba(28,42,33,.08);
  --f-display:"DynaPuff","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --dry:#d7a867; --dry-soft:#3a2d1c;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#1a241e; --surface-2:#202c25; --ink:#e6eee7; --muted:#9db0a3; --line:#2d3b32;
  --accent:#f0a044; --accent-ink:#1d1306; --accent-soft:#3a2a17;
  --leaf:#6cc48b; --leaf-soft:#1f3527;
  --eat:#f0806b; --move:#6aaee8; --rest:#a596ef; --mind:#62c896;
  --dry:#d7a867; --dry-soft:#3a2d1c;
  --frost:#79bce6; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 104px;display:flex;flex-direction:column;gap:18px}
.app.bare{padding-bottom:32px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:1.6rem}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;color:var(--leaf);display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.pill.streak{color:var(--accent)}
.pill.cold{color:var(--muted)}
.pill.xp{color:var(--leaf)}
.pill.dry{color:var(--dry);background:var(--dry-soft);border-color:transparent}

/* Garden scene: a committed illustration whose palette follows the real time of day, not the app theme */
.scene{position:relative;border-radius:24px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow);
  --sky1:#8ccbef;--sky2:#d9f1f7;--orb:#ffe066;--hill1:#a8d58b;--hill2:#93c776;--g1:#8fc76c;--g2:#6aa94f;--soil:#7a5236;--soil2:#5f3e27}
.scene.tod-dawn{--sky1:#f3c3a6;--sky2:#bfdfe9;--orb:#ffcf7a;--hill1:#a4cf8a;--hill2:#8dc177;--g1:#8cc26b;--g2:#69a651}
.scene.tod-dusk{--sky1:#5d4f9e;--sky2:#f3a06e;--orb:#ff9d5c;--hill1:#6d8f62;--hill2:#5d8156;--g1:#76a35a;--g2:#5b8a47;--soil:#6c4831}
.scene.tod-night{--sky1:#0d1a36;--sky2:#2c3d6b;--orb:#f2efd6;--hill1:#2e4d3d;--hill2:#26432f;--g1:#3d6a47;--g2:#2b5238;--soil:#4f3624;--soil2:#3e2a1c}
.scene.dry{--g1:#b9b06a;--g2:#9b9150;--hill1:#c2b77a;--hill2:#b0a465}
.scene.dry.tod-night{--g1:#5b5a3a;--g2:#4a4930;--hill1:#4f4d34;--hill2:#45432d}
.sky{position:relative;height:84px;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.scene.big .sky{height:110px}
.orb{position:absolute;top:18px;right:34px;width:34px;height:34px;border-radius:50%;background:var(--orb);box-shadow:0 0 30px 6px color-mix(in srgb,var(--orb) 55%,transparent)}
.tod-night .orb{box-shadow:0 0 22px 4px rgba(242,239,214,.35)}
.stars{position:absolute;inset:0;opacity:0;background-image:radial-gradient(1.4px 1.4px at 12% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 28% 62%,#fff,transparent),radial-gradient(1.6px 1.6px at 46% 22%,#fff,transparent),radial-gradient(1.1px 1.1px at 63% 48%,#fff,transparent),radial-gradient(1.3px 1.3px at 78% 70%,#fff,transparent),radial-gradient(1.2px 1.2px at 8% 75%,#fff,transparent),radial-gradient(1.4px 1.4px at 55% 80%,#fff,transparent)}
.tod-night .stars{opacity:.85}
.hill{position:absolute;bottom:-40px;border-radius:50%}
.hill.h1{left:-20%;width:80%;height:90px;background:var(--hill1)}
.hill.h2{right:-25%;width:85%;height:76px;background:var(--hill2)}
.bed{position:relative;background:linear-gradient(180deg,var(--g1),var(--g2));padding:6px 10px 16px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:4px;row-gap:0}
.plot{position:relative;aspect-ratio:1/.86;border:0;background:none;padding:0;display:block;-webkit-tap-highlight-color:transparent}
.plot .soil{position:absolute;left:9%;right:9%;bottom:8%;height:36%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--soil),var(--soil2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.plot.empty .soil{opacity:.75}
.plot .add{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.9);color:#3b5b2e;font-weight:700;font-size:16px;line-height:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.plot svg.plant{position:absolute;left:50%;bottom:15%;width:118%;transform:translateX(-50%);transform-origin:50% 100%;overflow:visible;pointer-events:none;transition:transform .5s,filter .5s}
.plot svg.plant.tall{width:150%}
.scene.interactive .plot:hover .soil{box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.7)}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.scene.dry .sway{animation:none;transform:rotate(8deg) skewX(5deg)}
.visitor{position:absolute;pointer-events:none;z-index:5}
.bfly{width:20px;animation:flutter 9s ease-in-out infinite}
.bfly svg{animation:flap .35s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes flap{to{transform:scaleX(.45)}}
@keyframes flutter{0%{transform:translate(0,0)}25%{transform:translate(60px,-18px)}50%{transform:translate(120px,10px)}75%{transform:translate(50px,26px)}100%{transform:translate(0,0)}}
.scene-note{position:absolute;left:12px;top:12px;z-index:6;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#3c3020;max-width:calc(100% - 100px)}
.scene-note.warn{background:#fff1d6;color:#7a4300}
.scene-link{display:block;width:100%;border:0;padding:0;background:none;text-align:left;border-radius:24px}
.health{position:absolute;right:12px;bottom:10px;z-index:6;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:#3c3020;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:999px}
.health i{display:block;width:54px;height:6px;border-radius:999px;background:#e6dcc7;overflow:hidden}
.health i b{display:block;height:100%;background:#8a6a2f}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.dry{background:var(--dry-soft);border-color:transparent}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px}
.dot{flex:1;height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s}
.dot.on{background:var(--leaf);border-color:var(--leaf)}
.next{font-size:.88rem;color:var(--muted)}
.next b{color:var(--ink)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.dry i{background:var(--dry)}

/* Goals */
.goal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;transition:transform .12s,background .2s,border-color .2s}
.goal:active{transform:scale(.985)}
.goal .chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;transition:all .2s}
.goal .chk svg{width:16px;height:16px;opacity:0}
.goal.done{background:var(--surface-2)}
.goal.done .chk{background:var(--leaf);border-color:var(--leaf)}
.goal.done .chk svg{opacity:1}
.goal .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.goal .qt b{font-weight:600;overflow-wrap:anywhere}
.goal.done .qt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.goal .qt small{color:var(--muted);font-size:.8rem}
.gi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.gi svg{width:22px;height:22px}
.g0{background:var(--eat)} .g1{background:var(--rest)} .g2{background:var(--move)} .g3{background:var(--mind)} .g4{background:var(--accent)}

/* Flower ladder */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rung{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.rung svg{width:50px;height:58px}
.rung b{font-size:.8rem;font-weight:700;line-height:1.2}
.rung small{font-size:.72rem;color:var(--muted);line-height:1.25}
.rung .xpv{font-size:.74rem;font-weight:700;color:var(--leaf)}
.rung.locked svg{filter:grayscale(1);opacity:.35}
.rung.locked{background:none;border-style:dashed}
.rung.next{border-color:var(--accent);border-style:solid}

/* Lists */
.board{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rk{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.me{background:var(--accent-soft);border-radius:10px;border-bottom-color:transparent}
.row.me .rk{color:var(--accent)}
.row .xp{font-weight:700;font-variant-numeric:tabular-nums}
.zone{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf);padding:6px 4px 2px}
.buddy{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.buddy:last-child{border-bottom:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;color:#fff;background:var(--leaf)}
.av.lg{width:56px;height:56px;font-size:1.4rem}
.buddy .bt{flex:1;min-width:0}
.buddy .bt small{display:block;color:var(--muted);font-size:.82rem}
.bstreak{font-family:var(--f-display);font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.bstreak svg{width:18px;height:18px}
.glist{display:flex;flex-direction:column}
.gline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.gline:last-child{border-bottom:0}
.gline .bt{flex:1;min-width:0;overflow-wrap:anywhere}
.gline .bt small{display:block;color:var(--muted);font-size:.8rem}

/* Buttons and inputs */
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .1s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{padding:7px 11px;font-size:.84rem}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--leaf) 60%,#000)}
.btn.danger{background:var(--eat);color:#fff;box-shadow:none}
.btn.wide{width:100%;padding:13px 16px;font-size:1rem}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);font-size:1rem}
.input:focus{border-color:var(--leaf)}
.inrow{display:flex;gap:8px}
.inrow .input{flex:1;min-width:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px}
.choice .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.choice .qt b{font-weight:600;overflow-wrap:anywhere}
.choice .qt small{color:var(--muted);font-size:.8rem}
.choice .tick{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.choice .tick svg{width:14px;height:14px;opacity:0}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.choice[aria-pressed="true"] .tick{background:var(--leaf);border-color:var(--leaf)}
.choice[aria-pressed="true"] .tick svg{opacity:1}
.fineprint{font-size:.78rem;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.howto{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;max-width:62ch}
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}

/* You */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:.7rem;color:var(--muted);text-align:center;font-weight:700}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.cal .c.full{background:var(--leaf);border-color:var(--leaf)}
.cal .c.rec{background:var(--leaf-soft);border-color:var(--leaf)}
.cal .c.miss{background:var(--dry);border-color:var(--dry)}
.cal .c.today{outline:2px solid var(--accent);outline-offset:1px}
.cal .c.future,.cal .c.pre{opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.profile{display:flex;align-items:center;gap:14px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.74rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--leaf);background:var(--leaf-soft)}

/* Sheet, toast, celebration */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;animation:rise .25s cubic-bezier(.2,.8,.3,1)}
.sheet.center{border-radius:24px;margin:16px;align-self:center}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center;margin-top:-8px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.picks button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.picks button svg{width:52px;height:60px}
.picks button b{font-size:.84rem;font-weight:700}
.picks button small{font-size:.74rem;color:var(--leaf);font-weight:700}
.picks button:hover:not(:disabled){border-color:var(--leaf)}
.sheet-row{display:flex;gap:8px;flex-wrap:wrap}
.sheet-row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px 9px 10px;border-radius:14px;font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:pop .25s}
.toast svg{width:30px;height:34px;flex:none;background:var(--surface);border-radius:8px}
.celebrate{text-align:center;align-items:center;display:flex;flex-direction:column;gap:12px}
.celebrate .big{font-family:var(--f-display);font-weight:700;font-size:4.2rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.reward{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:8px 14px 8px 8px;text-align:left;width:100%}
.reward.leaf{background:var(--leaf-soft)}
.reward.dry{background:var(--dry-soft)}
.reward svg{width:46px;height:54px;flex:none}
.eyebrow{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.petals{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.petals span{position:absolute;top:-20px;width:12px;height:8px;border-radius:60% 40% 60% 40%;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .sway,.bfly,.bfly svg{animation:none}
  .sheet,.toast,.backdrop{animation:none}
  .plot svg.plant,.bar i{transition:none}
}
@media (max-width:380px){.bed{padding-inline:6px;column-gap:2px}.ladder{gap:5px}.rung svg{width:40px;height:48px}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="Sections" id="tabbar"><div class="tabs-in" role="tablist" id="tabs"></div></nav>

<script>
(function(){
"use strict";
/* ---------- Rules ----------
   A goal day: every active goal checked off.
   Flowers, lowest to highest: marigold (1 XP), sunflower (5), red rose (20), pink lily (30).
   Each flower in the garden earns its XP on every goal day, scaled by garden health.
   Unlocks: 5 goal days in a row -> sunflower; 10 more in a row -> red rose; 20 more in a row -> pink lily.
   Each goal day (outside recovery) earns one flower to plant.
   A missed day dries the garden by 35 points. It then takes 3 goal days to recover to 100%,
   and no flower can be added during those 3 days. */
const FLOWERS = {
  marigold:{name:"Marigold",  xp:1},
  sunflower:{name:"Sunflower",xp:5, tall:true},
  rose:     {name:"Red rose", xp:20},
  lily:     {name:"Pink lily",xp:30, tall:true}
};
const ORDER = ["marigold","sunflower","rose","lily"];
const NEEDS = [0,5,10,20];          // goal days in a row (since the previous unlock) to unlock each tier
const DRY_PER_MISS = 35, RECOVERY_DAYS = 3, PLOTS = 20;
const PRESETS = [
  {id:"nosugar", t:"No added sugar today",       sub:"Skip sweets, desserts and sugary drinks", icon:"cup"},
  {id:"makeup",  t:"Remove makeup before sleep", sub:"Cleanse your face before bed",            icon:"moon"},
  {id:"steps",   t:"Walk 10,000 steps",          sub:"A long walk, or a commute on foot",       icon:"shoe"}
];
const STORE = "tamanna-garden-v2";

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function realToday(){ const d=new Date(); d.setHours(12,0,0,0); return d; }
function today(){ const d=realToday(); d.setDate(d.getDate()+((S&&S.offset)||0)); return d; }
function addDays(k,n){ const [y,m,dd]=k.split("-").map(Number); const d=new Date(y,m-1,dd,12); d.setDate(d.getDate()+n); return key(d); }
const T = () => key(today());
function fmtDate(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;

/* ---------- Storage: a small on-device database of registered gardeners ---------- */
function blankDB(){ return {v:2, current:null, users:{}}; }
function loadDB(){ try{ const raw=localStorage.getItem(STORE); if(raw){ const p=JSON.parse(raw); if(p&&p.v===2&&p.users) return p; } }catch(e){} return null; }
function saveDB(){ try{ localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }
let DB = loadDB() || blankDB();
let S = DB.current ? DB.users[DB.current] : null;

function newUser(name, goals){
  const t=key(realToday());
  return {id:"u"+Date.now().toString(36), name, created:t, start:t, offset:0,
    goals:goals.map(g=>({...g, from:t})), log:{}, full:{}, flowers:[]};
}
function sampleUser(){
  const t=key(realToday());
  const u={id:"sample", name:"Asha (sample)", sample:true, created:addDays(t,-17), start:addDays(t,-17), offset:0,
    goals:[
      {id:"nosugar",t:PRESETS[0].t,icon:"cup",from:addDays(t,-17)},
      {id:"makeup", t:PRESETS[1].t,icon:"moon",from:addDays(t,-17)},
      {id:"steps",  t:PRESETS[2].t,icon:"shoe",from:addDays(t,-17)},
      {id:"cread",  t:"Read 10 pages before bed",custom:true,from:addDays(t,-17)}
    ], log:{}, full:{}, flowers:[]};
  const ids=u.goals.map(g=>g.id);
  for(let i=17;i>=1;i--){ const k=addDays(t,-i); u.log[k]=ids.slice(); u.full[k]=true; }
  u.log[t]=["nosugar"];
  const F=(plot,f,ago)=>u.flowers.push({plot,f,on:addDays(t,-ago),off:null});
  // Five marigolds first, sunflowers once unlocked on day 5, a red rose after day 15.
  F(0,"marigold",17); F(1,"marigold",16); F(5,"marigold",15); F(6,"marigold",14); F(10,"marigold",13);
  F(2,"sunflower",12); F(3,"sunflower",11); F(7,"sunflower",10); F(8,"sunflower",9); F(11,"sunflower",8); F(12,"sunflower",7); F(15,"sunflower",6); F(16,"sunflower",5);
  F(13,"rose",2);
  return u;
}

/* ---------- Derived state: replayed from the log so every number stays consistent ---------- */
const activeGoals = (k=T()) => S.goals.filter(g=>g.from<=k);
const doneList = k => S.log[k]||[];
function refreshToday(){
  const k=T(), g=activeGoals(k);
  S.full[k] = g.length>0 && g.every(x=>doneList(k).includes(x.id));
}
const flowersOn = d => S.flowers.filter(f=>f.on<=d && (!f.off || d<f.off));
const current = () => S.flowers.filter(f=>!f.off);
const atPlot = i => S.flowers.find(f=>f.plot===i && !f.off) || null;

function sim(){
  const t=T();
  let health=100, rec=null, streak=0, best=0, since=0, tier=0, xp=0, slots=0;
  const days={}, unlocked=[{tier:0,d:S.start}];
  for(let d=S.start, i=0; d<=t && i<2000; d=addDays(d,1), i++){
    const full=!!S.full[d];
    if(d===t && !full) break;                      // today is still in play
    if(full){
      streak++; since++; best=Math.max(best,streak);
      const recovering=!!rec;
      if(rec){
        rec.left--;
        health = rec.left===0 ? 100 : Math.round(rec.from+(100-rec.from)*(RECOVERY_DAYS-rec.left)/RECOVERY_DAYS);
        if(!rec.left) rec=null;
      } else slots++;
      if(tier<3 && since>=NEEDS[tier+1]){ tier++; since=0; unlocked.push({tier,d}); }
      const inc=Math.round(flowersOn(d).reduce((a,f)=>a+FLOWERS[f.f].xp,0)*health/100);
      xp+=inc; days[d]={full:true,inc,health,recovering,recLeft:rec?rec.left:0};
    } else {
      streak=0; since=0; health=Math.max(0,health-DRY_PER_MISS); rec={left:RECOVERY_DAYS,from:health};
      days[d]={miss:true,health};
    }
  }
  const avail=slots-S.flowers.length;
  const todayRec = days[t] && days[t].recovering;
  const blocked = !!rec || !!todayRec;
  return {health,rec,streak,best,since,tier,xp,slots,avail,blocked,days,unlocked};
}
const unlockedFlowers = st => ORDER.slice(0,st.tier+1);
function weekStart(){ const d=today(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return key(d); }
const daysIntoWeek = () => (today().getDay()+6)%7+1;
function weekXP(st){ let k=weekStart(), x=0; for(let i=0;i<daysIntoWeek();i++){ if(st.days[k]&&st.days[k].inc) x+=st.days[k].inc; k=addDays(k,1);} return x; }

/* ---------- Illustrations ---------- */
const G="#4b993f";
const mound = () => `<ellipse cx="30" cy="75" rx="10" ry="3.6" fill="#5a3b24"/>`;
const stem = (h,w=2.4,b=75) => `<path d="M30 ${b} Q27 ${b-h*.5} 30 ${b-h}" stroke="${G}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const leaf = (x,y,r,s=1,c="#5aae45") => `<ellipse cx="${x}" cy="${y}" rx="${(6*s).toFixed(1)}" ry="${(2.5*s).toFixed(1)}" fill="${c}" transform="rotate(${r} ${x} ${y})"/>`;
function ring(cx,cy,n,rad,fn){ let o=""; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; o+=fn(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad, i*360/n); } return o; }

  },
  sunflower(){

      `<circle cx="30" cy="26" r="5.8" fill="#6b3a1d"/><circle cx="28" cy="24.5" r=".9" fill="#a8672f"/><circle cx="32" cy="27" r=".9" fill="#a8672f"/><circle cx="29" cy="28" r=".8" fill="#a8672f"/>`;
  },

    return mound()+stem(36,2.4)+

      leaf(23,62,-30,1.05,"#3f8f3c")+leaf(37,55,30,1.05,"#3f8f3c")+leaf(24,51,-35,.75,"#4c9c45")+
      `<path d="M24 42 L22 46 M36 42 L38 46 M30 44 L30 47" stroke="#3f8f3c" stroke-width="2" stroke-linecap="round"/>`+
      `<circle cx="30" cy="35" r="9.2" fill="#a3122a"/>`+
      `<path d="M20.8 35 Q21.5 44.5 30 45 Q38.5 44.5 39.2 35 Q35 41 30 41 Q25 41 20.8 35Z" fill="#7f0d1f"/>`+
      `<circle cx="30" cy="33.5" r="6.4" fill="#cf2239"/>`+
      `<path d="M24.6 34 Q26 27 31 27.6 Q35.6 28.4 35.4 33 Q33 29.6 29.6 30.6 Q26.4 31.6 24.6 34Z" fill="#e2394f"/>`+
      `<path d="M27 34.6 Q28.6 31.6 31.6 32.4 Q33.4 33.2 32.6 35.4 Q31.6 33.8 29.8 34.2" stroke="#8f0f22" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  },
  lily(){
    const petal=(a,len,c)=>`<path d="M30 30 Q${30-3.6} ${30-len*.55} 30 ${30-len} Q${30+3.6} ${30-len*.55} 30 30Z" fill="${c}" transform="rotate(${a} 30 30)"/>`;
    let o=mound()+`<path d="M30 75 Q28 54 30 33" stroke="${G}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`+
      `<path d="M30 70 Q18 60 15 48 Q24 56 30 64Z" fill="#4c9c45"/><path d="M30 62 Q42 54 45 42 Q37 50 30 57Z" fill="#3f8f3c"/>`+
      `<path d="M30 52 Q36 46 38 40" stroke="${G}" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="38.6" cy="38" rx="2.4" ry="5" fill="#f7a8c4" transform="rotate(25 38.6 38)"/>`;
    [0,120,240].forEach(a=>o+=petal(a+30,15,"#f06f9e"));
    [60,180,300].forEach(a=>o+=petal(a+30,16,"#f59bbd"));
    [60,180,300].forEach(a=>o+=`<path d="M30 30 L30 ${30-11}" stroke="#e0507f" stroke-width="1" transform="rotate(${a+30} 30 30)"/>`);
    [[27,25],[33,26],[30,22.5],[26.5,31],[34,31.5]].forEach(([x,y])=>o+=`<circle cx="${x}" cy="${y}" r=".75" fill="#b8325f"/>`);
    [[-28],[-10],[8],[26]].forEach(([a])=>o+=`<path d="M30 30 L30 22" stroke="#f3e0a8" stroke-width=".9" transform="rotate(${a} 30 30)"/><ellipse cx="30" cy="21.4" rx="1.1" ry="1.8" fill="#c0632a" transform="rotate(${a} 30 30)"/>`);
    return o+`<circle cx="30" cy="30" r="2" fill="#f7d26a"/>`;

};
function flowerSVG(f, cls="", style=""){
  return `<svg class="${cls}" ${style} viewBox="0 0 60 80" aria-hidden="true"><g class="sway" style="animation-delay:-${(f.length*0.37%5).toFixed(2)}s">${DRAW[f]()}</g></svg>`;
}
function dryStyle(health){
  if(health>=100) return "";
  const h=health/100, s=(.55+.45*h).toFixed(3);
  return `style="transform:translateX(-50%) scale(${s});filter:saturate(${(.12+.88*h).toFixed(2)}) sepia(${((1-h)*.75).toFixed(2)}) brightness(${(.82+.18*h).toFixed(2)})"`;
}
const butterflySVG = (a="#f2884b",b="#ffd36b") => `<svg viewBox="0 0 20 16" aria-hidden="true"><ellipse cx="6" cy="6" rx="5" ry="4.5" fill="${a}"/><ellipse cx="14" cy="6" rx="5" ry="4.5" fill="${a}"/><ellipse cx="6.5" cy="11.5" rx="3.6" ry="3" fill="${b}"/><ellipse cx="13.5" cy="11.5" rx="3.6" ry="3" fill="${b}"/><rect x="9.3" y="3" width="1.4" height="11" rx=".7" fill="#3b2b24"/></svg>`;
const sproutIcon = (c="currentColor") => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22 V11" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12 C12 6 7 4 3 4 C3 9 6 12 12 12 Z" fill="${c}"/><path d="M12 10 C12 5 16 2 21 2 C21 7 18 10 12 10 Z" fill="${c}" opacity=".7"/></svg>`;
const dropIcon = () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 C9 8 6 11 6 15 a6 6 0 0 0 12 0 C18 11 15 8 12 3Z" fill="currentColor"/></svg>`;
const starIcon = () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4-4.9-4.4 6.5-.7z" fill="currentColor"/></svg>`;
const checkSVG = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 L6.5 12 L13 4.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const GOAL_ICONS = {
  cup:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1.3 11.4a2 2 0 0 1-2 1.6H9.3a2 2 0 0 1-2-1.6Z" fill="currentColor" opacity=".9"/><path d="M14.5 3 13 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.5 3.5 20.5 20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  moon:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" fill="currentColor"/><circle cx="17.5" cy="5" r="1.4" fill="currentColor"/><circle cx="20.5" cy="9" r="1" fill="currentColor"/></svg>`,
  shoe:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 16c0-3.4 1-7.4 2.2-10h4c.2 2 1.2 3.3 3.4 4.1l5.6 2c2 .7 3.8 2.2 3.8 3.9v1H2.5Z" fill="currentColor"/><path d="M2.5 19.5h19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
};
const goalIcon = g => GOAL_ICONS[g.icon] || sproutIcon();
const goalCls = g => { const i=PRESETS.findIndex(p=>p.id===g.id); return i>=0?"g"+i:"g3"; };

/* ---------- Scene ---------- */
function tod(){ const h=new Date().getHours(); return h>=5&&h<8?"dawn":h>=8&&h<17?"day":h>=17&&h<19?"dusk":"night"; }
function scene(st, interactive){
  const t=tod(), dry=st.health<100, fullToday=!!S.full[T()];
  const canPlant=interactive && st.avail>0 && !st.blocked;
  let tiles="";
  for(let i=0;i<PLOTS;i++){
    const z=`style="z-index:${Math.floor(i/5)+1}"`, p=atPlot(i);
    if(!p){
      tiles+= interactive
        ? `<button class="plot empty" data-plot="${i}" ${z} aria-label="Empty plot ${i+1}"><span class="soil"></span>${canPlant?`<span class="add">+</span>`:""}</button>`
        : `<div class="plot empty" ${z}><span class="soil"></span></div>`;
      continue;
    }
    const fl=FLOWERS[p.f], svg=flowerSVG(p.f, "plant "+(fl.tall?"tall":""), dryStyle(st.health));
    tiles+= interactive
      ? `<button class="plot" data-plot="${i}" ${z} aria-label="${fl.name}, ${st.health}% health"><span class="soil"></span>${svg}</button>`
      : `<div class="plot" ${z}><span class="soil"></span>${svg}</div>`;
  }
  let vis="";
  if(fullToday && !dry) [["8%","34%","0s","#f2884b","#ffd36b"],["44%","20%","-3s","#9b7be0","#d6c6ff"],["66%","50%","-6s","#4fb3d9","#c9ecf7"]].forEach(([l,tp,dl,a,b])=>vis+=`<span class="visitor bfly" style="left:${l};top:${tp};animation-delay:${dl}">${butterflySVG(a,b)}</span>`);
  const left=activeGoals().length-activeGoals().filter(g=>doneList(T()).includes(g.id)).length;
  let note;
  if(st.rec) note=`<span class="scene-note warn">Drying out. ${plural(st.rec.left,"goal day")} to revive</span>`;
  else if(!fullToday) note=`<span class="scene-note">${plural(left,"goal")} left today</span>`;
  else note=`<span class="scene-note">${current().length?"Watered for today":"Goal met. Plant your first flower"}</span>`;
  const health = `<span class="health" aria-label="Garden health ${st.health}%">${dropIcon().replace("<svg ",'<svg style="width:12px;height:12px;color:#3d8fc2" ')}<i><b style="width:${st.health}%"></b></i><span class="num">${st.health}%</span></span>`;
  return `<div class="scene tod-${t} ${dry?"dry":""} ${interactive?"interactive big":""}">
    <div class="sky"><div class="stars"></div><div class="orb"></div><div class="hill h1"></div><div class="hill h2"></div></div>
    <div class="bed">${tiles}</div>${vis}${note}${health}</div>`;
}

/* ---------- Views ---------- */
let tab="today";
function topBar(st){
  const cold=st.streak===0;
  return `<header class="top">
    <div class="brand">${sproutIcon("var(--leaf)")}Tamanna</div>
    <div class="pills">
      <span class="pill streak ${cold?"cold":""}" title="Goal days in a row">${sproutIcon()}<span class="num">${st.streak}</span>-day streak</span>
      <span class="pill xp" title="Total XP from your flowers">${starIcon()}<span class="num">${st.xp}</span> XP</span>
      ${st.health<100?`<span class="pill dry" title="Garden health">${dropIcon()}<span class="num">${st.health}%</span></span>`:""}
    </div></header>`;
}
function nextUnlockText(st){
  if(st.tier>=3) return `Every flower unlocked. Keep your streak to keep the lilies earning.`;
  const f=ORDER[st.tier+1], left=NEEDS[st.tier+1]-st.since;
  return `<b>${FLOWERS[f].name}</b> unlocks after ${plural(left,"more goal day")} in a row.`;
}
function ladder(st){
  return `<div class="ladder">${ORDER.map((f,i)=>{
    const got=i<=st.tier, nxt=i===st.tier+1;
    const sub = i===0 ? "From day one" : got ? "Unlocked" : nxt ? `${st.since} / ${NEEDS[i]} days` : `${NEEDS[i]} days after ${FLOWERS[ORDER[i-1]].name.toLowerCase()}`;
    return `<div class="rung ${got?"":"locked"} ${nxt?"next":""}">${flowerSVG(f)}<b>${FLOWERS[f].name}</b><span class="xpv">${FLOWERS[f].xp} XP / day</span><small>${sub}</small></div>`;
  }).join("")}</div>`;
}
function plantStatus(st){
  if(st.rec) return `Your garden is recovering. Complete your goals for ${plural(st.rec.left,"more day")} to bring it back to 100%. You can't add flowers until then.`;
  if(st.blocked) return `Your garden recovered today. You can plant again after your next goal day.`;
  if(st.avail>0) return `You have ${plural(st.avail,"flower")} ready to plant.`;
  if(current().length>=PLOTS) return `Every plot is full. Replace a flower with a higher one when you earn your next.`;
  return S.full[T()] ? `Today's flower is planted. Come back tomorrow.` : `Complete today's goals to earn a flower.`;
}
function todayView(st){
  const goals=activeGoals(), list=doneList(T()), n=goals.filter(g=>list.includes(g.id)).length, full=!!S.full[T()];
  const dots=goals.map((g,i)=>`<span class="dot ${i<n?"on":""}"></span>`).join("");
  const incToday = st.days[T()] && st.days[T()].inc;
  const potential = Math.round(current().reduce((a,f)=>a+FLOWERS[f.f].xp,0)*st.health/100);
  const goalBtns = goals.length ? goals.map(g=>{
    const isDone=list.includes(g.id);
    return `<button class="goal ${isDone?"done":""}" data-goal="${esc(g.id)}" aria-pressed="${isDone}"><span class="chk">${checkSVG}</span><span class="qt"><b>${esc(g.t)}</b><small>${isDone?"Done for today":"Tap when done"}</small></span><span class="gi ${goalCls(g)}">${goalIcon(g)}</span></button>`;
  }).join("") : `<div class="card"><p class="muted">No goals start today. Add one in the You tab.</p></div>`;
  const canPlant = st.avail>0 && !st.blocked;
  return topBar(st)+
    `<button class="scene-link" data-go="garden" aria-label="Open your garden">${scene(st,false)}</button>
    ${st.rec?`<div class="card dry"><div class="sec-h"><h3>Your flowers are drying</h3><span class="num" style="font-weight:700;color:var(--dry)">${st.health}%</span></div>
      <div class="bar dry"><i style="width:${st.health}%"></i></div>
      <p class="next">A missed day dries every flower by ${DRY_PER_MISS}%. Complete your goals for ${plural(st.rec.left,"more day")} to bring the garden back to 100%. No new flowers until then.</p></div>`:""}
    <div class="card">
      <div class="sec-h"><h2>Today</h2><span class="muted num">${n} of ${goals.length} goals</span></div>
      <div class="dots">${dots}</div>
      <p class="next">${full?`Goal day complete${incToday?`. Your flowers earned <b>${incToday} XP</b>`:""}.`:`Finish every goal to grow your streak${potential?` and earn <b>${potential} XP</b> from your flowers`:""}.`}</p>
      <p class="next">${nextUnlockText(st)}</p>
    </div>
    <section class="section"><div class="sec-h"><h2>My goals</h2><button class="btn small ghost" data-go="you">Edit goals</button></div>${goalBtns}</section>
    ${canPlant?`<button class="btn leaf wide" data-go="garden">Plant ${st.avail>1?`your ${st.avail} flowers`:"your flower"}</button>`:""}
    <p class="fineprint">A day counts when every goal is done. Each goal day earns a flower, and each flower earns XP on every goal day after it.</p>`;
}
function gardenView(st){
  const planted=current().length;
  const earning=Math.round(current().reduce((a,f)=>a+FLOWERS[f.f].xp,0)*st.health/100);
  const counts=ORDER.map(f=>[f,current().filter(x=>x.f===f).length]).filter(x=>x[1]);
  return topBar(st)+scene(st,true)+

/* Neighbours (simulated for the demo) */
function rnd(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return ((h>>>0)%10000)/10000; }
const NB=[["Meera","#c2557a"],["Kabir","#2e76b8"],["Ishita","#8a5fb5"],["Rohan","#c9701d"],["Zoya","#2f8a62"],["Aarav","#b2493a"],["Dev","#4a6fa5"],["Tara","#7b8a2e"]];
const friendDone = (n,k) => rnd(n+"|"+k) < 0.86;
function buddyStreak(n){ let k=(S.full[T()]&&friendDone(n,T()))?T():addDays(T(),-1), c=0; for(let i=0;i<400;i++){ if(S.full[k]&&friendDone(n,k)) c++; else break; k=addDays(k,-1);} return c; }
function neighboursView(st){
  const wk=weekStart(), dw=daysIntoWeek();
  const rows=NB.map(([n,c])=>({n,c,xp:Math.round(dw*(4+rnd(n+wk)*60))})).concat([{n:"You",me:true,xp:weekXP(st)}]).sort((a,b)=>b.xp-a.xp);
  const board=rows.map((r,i)=>(i===3?`<div class="zone" style="color:var(--muted)">Safe zone</div>`:"")+`<div class="row ${r.me?"me":""}"><span class="rk">${i+1}</span><span>${r.me?"<b>You</b>":r.n}</span><span class="xp">${r.xp} XP</span></div>`).join("");
  const buddies=[NB[0],NB[1]].map(([n,c])=>{
    const bs=buddyStreak(n), fd=friendDone(n,T()), me=!!S.full[T()];
    const status = fd ? `${n} has finished today.` : `${n} hasn't finished today yet.`;
    return `<div class="buddy"><span class="av" style="background:${c}">${n[0]}</span><div class="bt"><b>${n}</b><small>${status}${me?"":" Finish yours to keep the streak."}</small></div><span class="bstreak">${sproutIcon()}<span>${bs}</span></span><button class="btn small ghost" data-nudge="${n}" data-done="${fd?1:0}">${fd?"Send seed":"Nudge"}</button></div>`;
  }).join("");
  return topBar(st)+
    `<section class="section card"><div class="sec-h"><h2>Buddy gardens</h2><span class="muted">Shared streaks</span></div>

      <div class="board">${board}</div></section>
    <p class="fineprint">Neighbours on this screen are simulated so the demo works for a single visitor. The league ranks the XP your flowers earned this week.</p>`;
}

/* ---------- Actions ---------- */
function persist(){ if(S) DB.users[S.id]=S; saveDB(); }
// If today stops being a goal day, give back any flower planted with today's slot.
function rollback(){
  let st=sim(), removed=0;
  while(st.avail<0){
    const idx=S.flowers.map(f=>f.on===T()).lastIndexOf(true);
    if(idx<0) break;
    const f=S.flowers[idx]; S.flowers.splice(idx,1);
    const prev=S.flowers.filter(x=>x.plot===f.plot && x.off===T()).pop(); if(prev) prev.off=null;
    removed++; st=sim();
  }
  return removed;
}
function toggleGoal(id){
  const k=T(), before=sim(), wasFull=!!S.full[k];
  const list=S.log[k]||(S.log[k]=[]);
  if(list.includes(id)) list.splice(list.indexOf(id),1); else list.push(id);
  refreshToday();
  const removed=rollback(); persist(); render();
  if(!wasFull && S.full[k]) dayComplete(before);
  else if(wasFull && !S.full[k]) toast(removed?"Goal unmarked. Today's flower went back.":"Goal unmarked. Today no longer counts yet.");
  else if(list.includes(id)) { const left=activeGoals().filter(g=>!list.includes(g.id)).length; toast(`Nice. ${plural(left,"goal")} to go.`); }
}
function dayComplete(before){
  const st=sim(), d=st.days[T()]||{};

    rewards+= st.health>=100
      ? `<div class="reward leaf">${dropIcon().replace("<svg ",'<svg style="color:var(--frost);width:40px;height:40px" ')}<span><b>Back in full bloom</b><br><small class="muted">Your garden is at 100% again. You can plant after your next goal day.</small></span></div>`
      : `<div class="reward dry">${dropIcon().replace("<svg ",'<svg style="color:var(--dry);width:40px;height:40px" ')}<span><b>Recovering: ${st.health}%</b><br><small class="muted">${plural(st.rec?st.rec.left:0,"more goal day")} to full health. No new flowers yet.</small></span></div>`;
  } else if(st.avail>0){
    const best=ORDER[st.tier];
    rewards+=`<div class="reward leaf">${flowerSVG(best)}<span><b>A flower is ready to plant</b><br><small class="muted">Choose any flower you have unlocked, up to a ${FLOWERS[best].name.toLowerCase()}.</small></span></div>`;
  }
  petals();
  sheet(`<div class="celebrate">
    <span class="eyebrow">Goal day complete</span>
    <span class="big">${st.streak}</span>
    <h2>${st.streak===1?"Your streak has begun":`${st.streak} goal days in a row`}</h2>
    <p class="muted" style="max-width:34ch">${d.inc?`Your flowers earned ${d.inc} XP today.`:current().length?"":"Plant a flower and it starts earning XP today."}</p>
    ${rewards}
    <div class="sheet-row" style="width:100%">${st.avail>0&&!st.blocked?`<button class="btn leaf" data-act="see-garden">Plant a flower</button>`:`<button class="btn leaf" data-act="see-garden">See my garden</button>`}<button class="btn ghost" data-act="close">Close</button></div>
  </div>`, true);
}
function plantPicker(i, replacing){

function plotSheet(i){

function plant(i, f){
  const st=sim(), cur=atPlot(i);
  if(st.avail<=0 || st.blocked || !unlockedFlowers(st).includes(f)) return;
  if(cur){ if(ORDER.indexOf(f)<=ORDER.indexOf(cur.f)) return; cur.off=T(); }

function addGoal(text, preset){
  const t=T(), from=addDays(t,1);
  if(preset){ const p=PRESETS.find(x=>x.id===preset); if(!p||S.goals.some(g=>g.id===p.id)) return; S.goals.push({id:p.id,t:p.t,icon:p.icon,from}); toast(`Added "${p.t}". It starts tomorrow.`); }
  else { const v=text.trim(); if(!v) return; S.goals.push({id:"c"+Date.now().toString(36),t:v,custom:true,from}); toast(`Added "${esc(v)}". It starts tomorrow.`); }

function removeGoal(id){
  if(S.goals.length<=1) return;
  const g=S.goals.find(x=>x.id===id); if(!g) return;
  const before=sim(), wasFull=!!S.full[T()];
  S.goals=S.goals.filter(x=>x.id!==id); refreshToday(); rollback(); persist(); render();

function advance(){

  if(y&&y.miss) toast(`A day was missed. Your flowers dried to ${st.health}%.`);

function finishToday(){
  const k=T(), before=sim(); if(S.full[k]) return false;
  S.log[k]=activeGoals(k).map(g=>g.id); refreshToday(); persist(); render();
  if(S.full[k]) dayComplete(before);
  return true;
}
function autoPlant(){
  // Used by the fast-forward demo: plant the best unlocked flower in the first empty plot.
  const st=sim(); if(st.avail<=0||st.blocked) return;
  const free=[...Array(PLOTS).keys()].find(i=>!atPlot(i)); if(free===undefined) return;
  S.flowers.push({plot:free,f:ORDER[st.tier],on:T(),off:null});
}
function fastForward(){
  const before=sim();
  for(let i=0;i<5;i++){
    if(i>0) S.offset=(S.offset||0)+1;
    const k=T(); S.log[k]=activeGoals(k).map(g=>g.id); refreshToday(); autoPlant();
  }
  persist(); render();
  const st=sim();
  toast(st.tier>before.tier?`Five goal days. ${FLOWERS[ORDER[st.tier]].name} unlocked!`:`Five goal days done. Flowers planted automatically.`, st.tier>before.tier?ORDER[st.tier]:null);
}
function createUser(){
  const goals=reg.picks.map(id=>{ const p=PRESETS.find(x=>x.id===id); return {id:p.id,t:p.t,icon:p.icon}; })
    .concat(reg.custom.map((c,i)=>({id:"c"+Date.now().toString(36)+i,t:c,custom:true})));
  if(!goals.length) return;
  const u=newUser(reg.name.trim()||"Gardener", goals);
  DB.users[u.id]=u; DB.current=u.id; S=u; registering=false; addingOther=false;
  reg={name:"",picks:["nosugar"],custom:[]};
  persist(); go("today");
  toast(`Welcome, ${esc(u.name)}. Finish today's goals to earn your first marigold.`, "marigold");
}
function switchTo(id){ if(!DB.users[id]) return; DB.current=id; S=DB.users[id]; registering=false; persist(); go("today"); toast(`Switched to ${esc(S.name)}`); }

document.addEventListener("input",e=>{ if(e.target.id==="reg-name") reg.name=e.target.value; });
document.addEventListener("submit",e=>{
  const f=e.target.closest("form"); if(!f) return; e.preventDefault();
  const v=(f.elements.goal&&f.elements.goal.value)||"";
  if(f.dataset.form==="reg-other"){ const t=v.trim(); if(t){ reg.custom.push(t); render(); const i=document.getElementById("other-reg"); if(i) i.focus(); } }
  else if(f.dataset.form==="profile"){ addGoal(v); const i=document.getElementById("other-profile"); if(i) i.focus({preventScroll:true}); }
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t||t.disabled) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.goal){ toggleGoal(t.dataset.goal); return; }
  if(t.dataset.plot!==undefined){ plotSheet(+t.dataset.plot); return; }
  if(t.dataset.plant){ plant(+t.dataset.at, t.dataset.plant); return; }
  if(t.dataset.replace!==undefined){ plantPicker(+t.dataset.replace, true); return; }
  if(t.dataset.pick){ const id=t.dataset.pick; reg.picks=reg.picks.includes(id)?reg.picks.filter(x=>x!==id):reg.picks.concat(id); render(); const b=document.querySelector(`[data-pick="${id}"]`); if(b) b.focus({preventScroll:true}); return; }
  if(t.dataset.unpick!==undefined){ reg.custom.splice(+t.dataset.unpick,1); render(); return; }
  if(t.dataset.addpreset){ addGoal("", t.dataset.addpreset); return; }
  if(t.dataset.delgoal){ removeGoal(t.dataset.delgoal); return; }
  if(t.dataset.switch){ switchTo(t.dataset.switch); return; }
  if(t.dataset.nudge){ toast(t.dataset.done==="1"?`Marigold seed sent to ${t.dataset.nudge}`:`Nudge sent to ${t.dataset.nudge}`, t.dataset.done==="1"?"marigold":null); return; }
  const a=t.dataset.act; if(!a) return;
  if(a==="close"){ closeSheet(); }
  else if(a==="see-garden"){ closeSheet(true); go("garden"); }
  else if(a==="go-today"){ closeSheet(true); go("today"); }
  else if(a==="other"){ addingOther=!addingOther; render(); if(addingOther){ const i=document.getElementById("other-reg"); if(i) i.focus(); } }
  else if(a==="create"){ createUser(); }
  else if(a==="register"){ registering=true; addingOther=false; render(); window.scrollTo({top:0}); }
  else if(a==="cancel-reg"){ registering=false; render(); }
  else if(a==="sample"){ const u=sampleUser(); DB.users[u.id]=u; switchTo(u.id); }
  else if(a==="finish"){ if(!finishToday()) toast("Today's goals are already done."); }
  else if(a==="tomorrow"){ advance(); }
  else if(a==="ff5"){ fastForward(); }
  else if(a==="del"){ confirmDelete=true; render(); }
  else if(a==="del-no"){ confirmDelete=false; render(); }
  else if(a==="del-yes"){
    const name=S.name; delete DB.users[S.id]; confirmDelete=false;
    const next=Object.keys(DB.users)[0];
    if(next){ DB.current=next; S=DB.users[next]; persist(); go("today"); }
    else { DB.current=null; S=null; saveDB(); registering=true; render(); }
    toast(`${esc(name)}'s garden was deleted`);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

if(S){ refreshToday(); persist(); }
render();
setInterval(()=>{ const sc=document.querySelector(".scene"); if(sc && !document.getElementById("sheet")){ const c="tod-"+tod(); if(!sc.classList.contains(c)) render(); } }, 60000);
})();
</script>
